<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brumac Enterprises</title>
<meta name="theme-color" content="#2E7D5B">
<meta name="description" content="Herd records, daily milk log and cereal sales for the farm.">
<link rel="icon" href="bmr.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F3; --surface:#FFFFFF; --surface-2:#ECF0EB; --ink:#16241D; --ink-soft:#5D6C63;
  --line:#DFE6DE; --edge:#93A196;
  --green:#2E7D5B; --green-deep:#20573F; --on-green:#FFFFFF; --green-tint:#E2EFE8;
  --amber:#9A6B12; --amber-tint:#F6ECD3;
  --red:#B84A3F; --red-tint:#F8E4E1;
  --ring:rgba(46,125,91,.22);
  --shadow-sm:0 1px 2px rgba(22,36,29,.06);
  --shadow-md:0 1px 2px rgba(22,36,29,.05),0 10px 28px -14px rgba(22,36,29,.22);
  --shadow-lg:0 2px 4px rgba(22,36,29,.06),0 20px 48px -18px rgba(22,36,29,.3);
  --r-sm:9px; --r-md:13px; --r-lg:18px;
  --serif:"Young Serif", Georgia, "Times New Roman", serif;
  --sans:"Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E1512; --surface:#18211C; --surface-2:#202B25; --ink:#E6EEE8; --ink-soft:#9AABA0;
    --line:#28352E; --edge:#5F6F65;
    --green:#7CC9A0; --green-deep:#57A97E; --on-green:#0C1710; --green-tint:#1D3B2C;
    --amber:#E9C46E; --amber-tint:#3B3116;
    --red:#F09A8F; --red-tint:#43211D;
    --ring:rgba(124,201,160,.25);
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow-md:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
    --shadow-lg:0 2px 4px rgba(0,0,0,.35),0 20px 48px -18px rgba(0,0,0,.7);
  }
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;color:var(--ink);font:400 16px/1.55 var(--sans);background:
  radial-gradient(1100px 480px at 85% -10%, color-mix(in srgb, var(--green) 9%, transparent), transparent 70%),
  radial-gradient(900px 420px at -10% 0%, color-mix(in srgb, var(--green) 7%, transparent), transparent 70%),
  var(--bg);
  background-attachment:fixed}
::selection{background:var(--green-tint);color:var(--green-deep)}
@media (prefers-color-scheme: dark){ body{background:var(--bg)} }
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{font-size:14px;font-weight:600;padding:0;margin-bottom:4px}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}

.top{position:sticky;top:0;z-index:20;padding-top:16px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .2s ease}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:4px}
.brand{font:400 30px/1.1 var(--serif);letter-spacing:-.015em}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.uname{font-weight:600}
.role{display:inline-block;padding:3px 11px;border-radius:999px;background:var(--green-tint);color:var(--green);font-weight:600;font-size:14px}
.tabs{display:flex;gap:4px;margin:14px 0 4px;padding:4px;width:max-content;max-width:100%;overflow-x:auto;background:var(--surface-2);border-radius:999px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs.sub{margin:10px 0 4px;font-size:14px}
.tabs.sub .tab{padding:7px 13px;min-height:36px}
.tab{background:transparent;border:0;padding:9px 16px;font-weight:600;color:var(--ink-soft);cursor:pointer;border-radius:999px;min-height:40px;white-space:nowrap;transition:color .15s ease,background-color .15s ease,box-shadow .15s ease}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--green);color:var(--on-green);box-shadow:var(--shadow-sm)}
.tab:focus-visible{outline:2px solid var(--green);outline-offset:2px}

main{padding:24px 0 110px}
h2{font:400 23px/1.2 var(--serif);letter-spacing:-.01em}
.sub{color:var(--ink-soft);margin:4px 0 0}
.logbar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:5px}
.field .hint{font-weight:400;color:var(--ink-soft)}
input[type=date],input[type=text],input[type=email],input[type=number],input[type=password],input[type=time],input[type=search],select,textarea{width:100%;padding:10px 13px;border:1px solid var(--edge);border-radius:var(--r-sm);background:var(--surface);min-height:44px;transition:border-color .15s ease,box-shadow .15s ease}
.searchbar{position:relative;margin-bottom:16px}
.searchbar input[type=search]{
  width:100%;min-height:48px;padding:12px 44px 12px 44px;border:1px solid var(--line);
  border-radius:999px;background:var(--surface);box-shadow:var(--shadow-sm);
  font-size:15px;transition:border-color .15s ease,box-shadow .15s ease;
}
.searchbar input[type=search]::placeholder{color:var(--ink-soft)}
.searchbar input[type=search]:hover{border-color:var(--edge)}
.searchbar input[type=search]:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--ring)}
.searchbar .s-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink-soft);pointer-events:none}
.searchbar .s-clear{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  width:32px;height:32px;border:0;border-radius:50%;background:var(--surface-2);
  color:var(--ink-soft);font-size:18px;line-height:1;cursor:pointer;display:none;
  align-items:center;justify-content:center;padding:0;
}
.searchbar .s-clear:hover{background:var(--line);color:var(--ink)}
.searchbar.has-query .s-clear{display:inline-flex}
.combo{position:relative}
.combo input[type=search]{padding-right:38px}
.combo-caret{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:24px;height:24px;border:0;background:transparent;color:var(--ink-soft);cursor:pointer;display:grid;place-items:center;padding:0;border-radius:6px}
.combo-caret:hover{color:var(--ink);background:var(--surface-2)}
.combo-menu{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;max-height:240px;overflow-y:auto;background:var(--surface);border:1px solid var(--edge);border-radius:var(--r-md);box-shadow:var(--shadow-lg);padding:4px}
.combo-opt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:9px 11px;border-radius:8px;cursor:pointer;font-size:15px}
.combo-opt:hover,.combo-opt.hi{background:var(--surface-2)}
.combo-opt[aria-selected="true"]{background:var(--green-tint);color:var(--green-deep);font-weight:600}
.combo-opt .c-meta{font-size:13px;color:var(--ink-soft);white-space:nowrap}
.combo-opt.out .c-meta{color:var(--red)}
.combo-empty{padding:11px 12px;color:var(--ink-soft);font-size:14px}
textarea{min-height:78px;resize:vertical}
input:hover:not(:focus),select:hover:not(:focus),textarea:hover:not(:focus){border-color:var(--ink-soft)}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--ring)}
button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
#logdate{width:auto}

.note{padding:11px 15px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line);margin-bottom:14px}
.error{padding:11px 15px;border-radius:var(--r-md);background:var(--red-tint);color:var(--red);margin-top:12px;font-weight:500}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 19px;border-radius:10px;border:1px solid var(--green);background:var(--green);color:var(--on-green);font-weight:600;cursor:pointer;min-height:44px;box-shadow:var(--shadow-sm);transition:transform .12s ease,box-shadow .15s ease,background-color .15s ease,opacity .15s ease}
.btn:hover:not([disabled]){transform:translateY(-1px);box-shadow:var(--shadow-md);background:var(--green-deep);border-color:var(--green-deep)}
.btn:active:not([disabled]){transform:translateY(0);box-shadow:var(--shadow-sm)}
.btn.ghost{background:transparent;color:var(--green);border-color:transparent;box-shadow:none}
.btn.ghost:hover:not([disabled]){background:var(--green-tint);border-color:transparent;box-shadow:none}
.btn.danger{background:transparent;color:var(--red);border-color:transparent;box-shadow:none}
.btn.danger:hover:not([disabled]){background:var(--red-tint);border-color:transparent;box-shadow:none}
.btn.small{padding:6px 13px;min-height:36px;font-size:14px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:6px 0 0;color:var(--green);font-weight:600;cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:4px;font-size:14px}
.link:hover{text-decoration-style:solid}

.ledger{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-md)}
.row,.cow{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:13px 16px;border-top:1px solid var(--line);transition:background-color .12s ease}
.row:first-child,.cow:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.shop-product-row{cursor:pointer}
.shop-product-row:focus-visible{outline:2px solid var(--green);outline-offset:-2px}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow-md);display:flex;flex-direction:column;gap:12px}
.pcard-head{display:flex;align-items:center;gap:12px}
.product-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0}
.product-detail{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:4px}
.product-detail span{font-size:12px;color:var(--ink-soft);font-weight:600}
.product-detail strong{font-size:16px;font-variant-numeric:tabular-nums}
@media(max-width:440px){.product-detail-grid{grid-template-columns:1fr}}
.cow{width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;cursor:pointer}
.cow:hover{background:var(--surface-2)}
.cow:focus-visible{outline-offset:-3px}
.coat{display:block;flex:none;border-radius:50%}
.chip{width:44px;height:44px;border-radius:50%;background:var(--amber-tint);color:var(--amber);display:grid;place-items:center;font:400 20px/1 var(--serif);flex:none}
.nm{font-weight:600}
.meta{font-size:14px;color:var(--ink-soft)}
.entry{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.lit{display:flex;align-items:center;gap:6px;font-weight:600}
.lit input{width:96px;text-align:right;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.kes{font-size:13px;color:var(--amber);font-variant-numeric:tabular-nums;min-height:1.4em;font-weight:600}
.tags{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pill{display:inline-block;padding:3px 11px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface-2);color:var(--ink-soft);white-space:nowrap}
.pill.milking{background:var(--green-tint);color:var(--green)}
.pill.dry{background:var(--amber-tint);color:var(--amber)}
.pill.due{background:var(--red-tint);color:var(--red)}
.empty{padding:36px 20px;text-align:center;color:var(--ink-soft)}
.empty p{margin:0 0 14px}
.sale{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line)}
.sale:first-child{border-top:0}
.mrow{display:grid;grid-template-columns:44px 1fr;gap:8px 12px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
.mrow:first-child{border-top:0}
.mrow .macts{grid-column:2;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mname{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill.admin{background:var(--green-tint);color:var(--green)}
.namebtn{background:none;border:0;padding:6px 9px;border-radius:8px;font-weight:600;color:var(--ink);cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:4px;transition:background-color .12s ease}
.namebtn:hover{background:var(--surface-2)}
.chip.big{width:64px;height:64px;font-size:28px;flex:none}
.grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}
@media (max-width:560px){.grid3{grid-template-columns:1fr 1fr}.grid3 .field:first-child{grid-column:1/-1}}
.salecard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;margin-bottom:18px;box-shadow:var(--shadow-md)}
.saleinfo{margin:12px 0;color:var(--ink-soft);font-size:15px;min-height:1.5em}
.saleinfo b{color:var(--ink)}
.saleamt{display:flex;align-items:center;gap:10px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.bal{font:400 24px/1.1 var(--serif);font-variant-numeric:tabular-nums;text-align:right}
.bal small{font:600 14px var(--sans);color:var(--ink-soft)}
.pactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.permlist{display:grid;gap:8px;margin:6px 0 0}
.perm{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border:1px solid var(--edge);border-radius:var(--r-md);cursor:pointer;background:var(--surface);transition:border-color .15s ease,background-color .15s ease}
.perm:hover{border-color:var(--green)}
.perm input{margin-top:3px;accent-color:var(--green);width:18px;height:18px;flex:none}
.perm b{display:block;font-weight:600}
.perm span{color:var(--ink-soft);font-size:14px}
.rolerow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.rolerow:first-child{border-top:0}
.rolerow .rk{display:flex;align-items:center;gap:10px}
.swatch{width:16px;height:16px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.reorder{display:flex;flex-direction:column;gap:2px}
.reorder button{width:26px;height:22px;border:1px solid var(--edge);background:var(--surface);border-radius:7px;cursor:pointer;color:var(--ink);font-size:12px;line-height:1;padding:0;transition:background-color .12s ease}
.reorder button:hover:not([disabled]){background:var(--surface-2)}
.reorder button[disabled]{opacity:.35;cursor:not-allowed}
.colorpick{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.colorpick label{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent;display:block;transition:transform .12s ease}
.colorpick label:hover{transform:scale(1.12)}
.colorpick input{position:absolute;opacity:0;width:1px;height:1px}
.colorpick label:has(input:checked){border-color:var(--ink);transform:scale(1.12)}
.pillstack{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.care{border-top:1px solid var(--line);padding:13px 16px;display:flex;gap:12px;align-items:flex-start}
.care:first-child{border-top:0}
.care .cf{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;flex:1;min-width:0}
.care .cf .f label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:2px}
.care .cf .f input{padding:7px 9px;min-height:38px;font-size:14px;width:100%}
.finsec{margin-bottom:32px}
.finsec:last-child{margin-bottom:0}
.landgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow-md)}
@media (max-width:480px){.landgrid{grid-template-columns:1fr}}
.switchrow{margin-top:24px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.switchrow label{display:flex;align-items:flex-start;gap:10px;font-weight:600;cursor:pointer}
.switchrow input{margin-top:3px;accent-color:var(--green);width:18px;height:18px;flex:none}
.switchrow p{margin:6px 0 0 28px}

.total{position:sticky;bottom:14px;z-index:5;margin-top:18px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;border-radius:var(--r-lg);padding:17px 20px;color:var(--on-green);background:linear-gradient(135deg,var(--green),var(--green-deep));box-shadow:0 14px 34px -12px color-mix(in srgb,var(--green) 65%,transparent)}
.total .eq{font-size:14px;opacity:.92}
.total .big{font:400 32px/1.15 var(--serif);font-variant-numeric:tabular-nums}
.total .btn{background:var(--on-green);color:var(--green);border-color:var(--on-green)}
.total .btn:hover:not([disabled]){background:var(--surface);border-color:var(--surface)}
.total .btn[disabled]{opacity:.45}

.chartwrap{margin:14px 0 22px}
.ymax{font-size:13px;color:var(--ink-soft);margin-bottom:4px;min-height:1.3em}
.bars{display:flex;align-items:flex-end;gap:3px;height:124px;border-bottom:1px solid var(--edge)}
.bar{flex:1;background:linear-gradient(180deg,var(--green),var(--green-deep));border-radius:4px 4px 0 0;min-width:2px;transition:height .25s ease}
.bar.zero{background:transparent}
.xl{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft);margin-top:5px}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.monthbar .lbl{font:400 24px/1.2 var(--serif)}
.monthbtns{display:flex;gap:8px}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-md)}
table{border-collapse:collapse;width:100%;min-width:400px;font-variant-numeric:tabular-nums}
th,td{padding:11px 15px;text-align:right;border-top:1px solid var(--line)}
tbody tr{transition:background-color .1s ease}
tbody tr:hover{background:var(--surface-2)}
th:first-child,td:first-child{text-align:left}
thead th{border-top:0;font-size:12px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
tfoot td{font-weight:700;background:var(--surface-2)}
.sumline{margin:10px 0 16px;font-size:18px}
.sumline b{font-weight:700}
.sec{font:400 19px/1.3 var(--serif);margin:30px 0 10px}

.auth{max-width:440px;margin:26px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow-lg)}
.auth .steps{margin:12px 0 0;padding-left:20px}
.auth .steps li{margin-bottom:6px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px;margin:16px 0}
.seg button{border:0;background:transparent;padding:9px;border-radius:9px;font-weight:600;color:var(--ink-soft);cursor:pointer;min-height:44px;transition:background-color .15s ease,color .15s ease,box-shadow .15s ease}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.stack{display:grid;gap:14px}
.stack .btn{width:100%}
.authfoot{margin-top:14px;text-align:center}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--edge);border-radius:var(--r-md);cursor:pointer;min-height:44px;font-weight:600;background:var(--surface);transition:border-color .15s ease,background-color .15s ease}
.opt input{accent-color:var(--green);margin:0}
.opt:has(input:checked){border-color:var(--green);background:var(--green-tint);color:var(--green)}
.opt:has(input:focus-visible){outline:2px solid var(--green);outline-offset:2px}

dialog{border:1px solid var(--line);border-radius:20px;padding:0;background:var(--surface);color:var(--ink);width:min(580px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;box-shadow:var(--shadow-lg)}
dialog::backdrop{background:rgba(10,20,14,.55);backdrop-filter:blur(3px)}
dialog[open]{animation:dlgIn .22s cubic-bezier(.2,.8,.3,1)}
@keyframes dlgIn{from{opacity:0;transform:translateY(12px) scale(.97)}}
.dlg{padding:24px}
.dhead{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.dhead h2{margin:0}
.facts{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:8px 18px;margin:0 0 18px}
.facts dt{color:var(--ink-soft)}
.facts dd{margin:0;overflow-wrap:anywhere}
.facts .none{color:var(--ink-soft);font-style:italic}
.block{margin:0 0 18px}
.block h3{font:400 18px/1.3 var(--serif);margin-bottom:4px}
.block p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}

/* Milk log and feed inputs: plain text until you press Edit */
#view-log input[data-cow]:disabled,#view-log input[data-cow]:disabled:hover,

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
function pad(n){ return String(n).padStart(2,"0"); }
function fmtISO(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function todayStr(){ return fmtISO(new Date()); }

  if(!dob) return "";
  const b=parseDate(dob), t=new Date();
  let months=(t.getFullYear()-b.getFullYear())*12+(t.getMonth()-b.getMonth());

  if(y===0) return m+(m===1?" month":" months");

/* ---------- Data mapping (database rows <-> page objects) ---------- */
function cowFromRow(r){
  return {id:r.id,tag:r.tag||"",name:r.name||"",breed:r.breed||"",dob:r.dob||"",status:r.status,
    lastCalving:r.last_calving||"",insemination:r.insemination||"",bull:r.bull||"",pregnancy:r.pregnancy,
    weight:r.weight_kg==null?"":Number(r.weight_kg),health:r.health||"",notes:r.notes||""};
}
function cowToRow(f){
  return {tag:f.tag,name:f.name||null,breed:f.breed||null,dob:f.dob||null,status:f.status,
    last_calving:f.lastCalving||null,insemination:f.insemination||null,bull:f.bull||null,pregnancy:f.pregnancy,
    weight_kg:f.weight!==""?parseFloat(f.weight):null,health:f.health||null,notes:f.notes||null};
}
function cerealFromRow(r){ return {id:r.id,name:r.name,unit:r.unit||"kg",buyingPrice:Number(r.buying_price||0),price:Number(r.price_per_kg),qty:Number(r.qty_kg)}; }
function saleFromRow(r){ return {id:r.id,kind:r.product_kind,cerealId:r.cereal_id,qty:Number(r.quantity),p:Number(r.price_per_unit),d:r.sold_on,ts:Date.parse(r.sold_at)||0,receipt:r.receipt_path||"",bp:(r.buying_price==null?null:Number(r.buying_price))}; }
// Cost of what was sold: buying price at the time of sale (falls back to today's buying price for older sales)
function saleCost(x){ const bp=(x.bp!=null)?x.bp:((findCereal(x.cerealId)||{}).buyingPrice||0); return x.qty*bp; }
function fmtClock(ts){ const d=new Date(ts); return pad(d.getHours())+":"+pad(d.getMinutes()); }

/* ---------- Milk and cereal lookups ---------- */
function milkPrice(){ return state.settings.milkPrice; }
function priceFor(cowId,date){ const v=state.milkPrices[cowId+"|"+date]; return typeof v==="number"?v:milkPrice(); }
// What this member is allowed to do: admins (with the PIN confirmed) can do everything;
// otherwise the permissions of their extra role apply.
function can(perm){
  if(state.admin) return true;
  const r=state.profile&&state.profile.roles;
  return !!(r&&Array.isArray(r.permissions)&&r.permissions.indexOf(perm)>=0);
}
function roleName(){ const r=state.profile&&state.profile.roles; return r&&r.name?r.name:""; }
function litresFor(cowId,date){ const v=state.milk[cowId+"|"+date]; return typeof v==="number"?v:null; }
function monthEntries(cowId,month){
  const out={}, pre=cowId+"|"+month;
  for(const k in state.milk) if(k.startsWith(pre)) out[k.slice(cowId.length+1)]=state.milk[k];
  return out;
}
function sortedCows(list){
  const rank={milking:0,dry:1,heifer:2,sold:3,deceased:4};
  return list.slice().sort((a,b)=>{
    const d=(rank[a.status]!=null?rank[a.status]:5)-(rank[b.status]!=null?rank[b.status]:5);
    if(d!==0) return d;
    return String(a.name||a.tag||"").localeCompare(String(b.name||b.tag||""),undefined,{numeric:true});
  });
}
function loggableCows(){ return sortedCows(state.cows.filter(c=>c.status!=="sold"&&c.status!=="deceased")); }
function sortedCereals(){ return state.cereals.slice().sort((a,b)=>String(a.name).localeCompare(String(b.name))); }

/* ---------- Cow coat avatar (unique Friesian-style patches per cow) ---------- */
function hash(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function rng(seed){ let a=seed; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return((t^t>>>14)>>>0)/4294967296; }; }
let avN=0;
function coat(seed,size){
  const r=rng(hash(String(seed))), id="cl"+(avN++), n=2+Math.floor(r()*3);
  let blobs="";
  const mid=(p,q)=>[(p[0]+q[0])/2,(p[1]+q[1])/2];
  for(let i=0;i<n;i++){
    const cx=8+r()*32, cy=8+r()*32, base=6+r()*9, k=7, pts=[];
    for(let j=0;j<k;j++){ const a=j/k*Math.PI*2, rad=base*(0.6+r()*0.7); pts.push([cx+Math.cos(a)*rad,cy+Math.sin(a)*rad]); }
    const m0=mid(pts[k-1],pts[0]);
    let d="M"+m0[0].toFixed(1)+" "+m0[1].toFixed(1);
    for(let j=0;j<k;j++){ const p=pts[j], q=pts[(j+1)%k], m=mid(p,q); d+="Q"+p[0].toFixed(1)+" "+p[1].toFixed(1)+" "+m[0].toFixed(1)+" "+m[1].toFixed(1); }
    blobs+='<path d="'+d+'Z" fill="#232B27"/>';
  }
  return '<svg class="coat" width="'+size+'" height="'+size+'" viewBox="0 0 48 48" aria-hidden="true"><defs><clipPath id="'+id+'"><circle cx="24" cy="24" r="23"/></clipPath></defs><g clip-path="url(#'+id+')"><rect width="48" height="48" fill="#F7F7F1"/>'+blobs+'</g><circle cx="24" cy="24" r="23" fill="none" style="stroke:var(--edge)" stroke-width="1.5"/></svg>';
}

/* ---------- Small UI helpers ---------- */
let toastT;
function toast(msg,isErr){
  const t=$("#toast"); t.textContent=msg; t.className=isErr?"err":""; t.hidden=false;
  clearTimeout(toastT); toastT=setTimeout(()=>{ t.hidden=true; },isErr?6000:3200);
}
function bars(items,aria,first,last){
  const max=Math.max(0,...items.map(i=>i.v)), top=max>0?max:1;
  return '<div class="chartwrap"><div class="ymax">'+(max>0?"Most in a day: "+fmtL(max)+" L":"")+'</div>'
    +'<div class="bars" role="img" aria-label="'+esc(aria)+'">'
    +items.map(i=>'<div class="bar'+(i.v>0?"":" zero")+'" style="height:'+(i.v>0?Math.max(3,i.v/top*100):0)+'%" title="'+esc(i.t)+'"></div>').join("")
    +'</div><div class="xl"><span>'+esc(first)+'</span><span>'+esc(last)+'</span></div></div>';
}
function missingRpc(e){
  const m=(e&&e.message)||"";
  return /schema cache|could not find the function|PGRST202/i.test(m);
}
async function tryRpc(name, args){
  try{ return await run(sb.rpc(name, args||{})); }
  catch(e){ if(missingRpc(e)) return null; throw e; }
}

/* ---------- Database access ---------- */
async function run(p){ const r=await p; if(r.error) throw r.error; return r.data; }
async function fetchAll(build){
  const out=[], size=1000;
  for(let from=0;;from+=size){
    const rows=await run(build(from,from+size-1));
    out.push.apply(out,rows);
    if(rows.length<size) break;
  }
  return out;
}
async function loadProfile(){
  const s=await sb.auth.getSession();
  state.user=s.data&&s.data.session?s.data.session.user:null;
  if(!state.user){ state.profile=null; state.admin=false; state.profileError=""; return; }
  let p=null, firstError=null;
  // Load the profile row independently of the optional roles relationship.
  // A missing/ambiguous PostgREST relationship must not make a valid member
  // appear to have no Brumac profile.
  try{
    p=await run(sb.from("profiles").select("id,name,email,role,phone,job_title,area,created_at,role_id").eq("id",state.user.id).maybeSingle());
  }catch(e){ firstError=e; }
  // Fallback to a narrowly scoped SECURITY DEFINER RPC if the profile
  // SELECT policy is stale or the row is not visible through PostgREST.
  if(!p){
    try{
      const fallback=await tryRpc("get_my_profile");
      p=Array.isArray(fallback)?(fallback[0]||null):fallback;
    }catch(e){ if(!firstError) firstError=e; }
  }
  // Last resort: ensure the profile row exists from server-controlled
  // auth metadata, then try reading it again.
  if(!p){
    try{
      await tryRpc("ensure_my_profile");
      p=await run(sb.from("profiles").select("id,name,email,role,phone,job_title,area,created_at,role_id").eq("id",state.user.id).maybeSingle());
      if(!p){
        const fallback=await tryRpc("get_my_profile");
        p=Array.isArray(fallback)?(fallback[0]||null):fallback;
      }
    }catch(e){ if(!firstError) firstError=e; }
  }
  if(p && p.role_id){
    try{
      const r=await run(sb.from("roles").select("name,permissions,color").eq("id",p.role_id).maybeSingle());
      p.roles=r||null;
    }catch(e){ p.roles=null; }
  }
  state.profile=p;
  state.profileError=firstError?friendly(firstError):"";
  state.admin=!!(p&&p.role==="admin");
}
function staffFromRow(r){ return {id:r.id,name:r.name,wage:Number(r.wage_amount),period:r.wage_period,active:r.active}; }
function costFromRow(r){ return {id:r.id,category:r.category,description:r.description||"",amount:Number(r.amount),date:r.cost_date,landId:r.land_id||""}; }
function landFromRow(r){ return {id:r.id,name:r.name,location:r.location||"",acres:Number(r.acres||0),costPerAcre:Number(r.cost_per_acre||0),notes:r.notes||""}; }
function findLand(id){ return state.lands.find(l=>l.id===id); }
function landHire(l){ return l.acres*l.costPerAcre; }
function totalLandHire(){ return state.lands.reduce((a,l)=>a+landHire(l),0); }

async function loadCore(){
  async function one(q){
    try{ return {ok:true, data:await q}; }
    catch(e){ return {ok:false, error:e}; }
  }
  async function loadRoles(){
    try{ return await run(sb.from("roles").select("*").order("position").order("created_at")); }
    catch(e){
      if(/position/i.test((e&&e.message)||"")) return await run(sb.from("roles").select("*").order("created_at"));
      throw e;
    }
  }
  const [cows, cereals, settings, roles, staff, land, lands] = await Promise.all([
    one(run(sb.from("cows").select("*").order("tag"))),
    one(run(sb.from("cereals").select("*").order("name"))),
    one(run(sb.from("farm_settings").select("*").eq("id",1).maybeSingle())),
    one(loadRoles()),
    one(run(sb.from("staff").select("*").order("name"))),
    one(run(sb.from("land_settings").select("*").eq("id",1).maybeSingle())),
    one(run(sb.from("farm_lands").select("*").order("name")))
  ]);
  const required=[["Herd",cows],["Shop products",cereals],["Farm settings",settings]].filter(x=>!x[1].ok);
  if(required.length){
    const e=required[0][1].error||new Error("Couldn't load farm records");
    e.message=required.map(x=>x[0]).join(", ")+": "+((e&&e.message)||"failed");
    throw e;
  }
  state.cows=cows.data.map(cowFromRow);
  state.cereals=cereals.data.map(cerealFromRow);
  if(settings.data) state.settings={
    milkPrice:Number(settings.data.milk_price_per_litre),
    milkStock:Number(settings.data.milk_stock_litres),
    farmName:settings.data.farm_name||"",
    location:settings.data.location||"",
    farmNotes:settings.data.farm_notes||""
  };
  const skipped=[];
  if(roles.ok) state.roles=roles.data||[]; else skipped.push("roles");
  if(staff.ok) state.staff=staff.data.map(staffFromRow); else { state.staff=[]; skipped.push("staff"); }
  if(land.ok){ if(land.data) state.land={costPerAcre:Number(land.data.cost_per_acre),acresHired:Number(land.data.acres_hired)}; }
  else skipped.push("land");
  if(lands.ok) state.lands=lands.data.map(landFromRow); else { state.lands=[]; skipped.push("farm lands"); }
  await loadProfile();
  try{
    const stock=await run(sb.rpc("refresh_milk_stock"));
    if(typeof stock==="number") state.settings.milkStock=stock;
  }catch(e){ /* older database without the RPC: keep the value read above */ }
  if(!skipped.length) return "";
  const sample=(!roles.ok&&roles.error)||(!staff.ok&&staff.error)||(!land.ok&&land.error)||(!lands.ok&&lands.error);
  return "Some records could not be loaded ("+skipped.join(", ")+"). "+friendly(sample);
}
async function loadMonth(m){
  const start=m+"-01", end=m+"-"+pad(daysInMonth(m));
  async function one(q){
    try{ return {ok:true, data:await q}; }
    catch(e){ return {ok:false, error:e}; }
  }
  const [milk, sales, feed, casual, costs, workers] = await Promise.all([
    one(fetchAll((a,b)=>sb.from("milk_entries").select("cow_id,entry_date,litres,price_per_litre").gte("entry_date",start).lte("entry_date",end).order("entry_date").order("cow_id").range(a,b))),
    one(fetchAll((a,b)=>sb.from("sales").select("*").gte("sold_on",start).lte("sold_on",end).order("sold_at").order("id").range(a,b))),
    one(fetchAll((a,b)=>sb.from("cow_feed").select("*").gte("entry_date",start).lte("entry_date",end).order("entry_date").order("cow_id").range(a,b))),
    one(fetchAll((a,b)=>sb.from("casual_labor_days").select("*").gte("work_date",start).lte("work_date",end).order("work_date").range(a,b))),
    one(fetchAll((a,b)=>sb.from("farm_costs").select("*").gte("cost_date",start).lte("cost_date",end).order("cost_date").range(a,b))),
    one(fetchAll((a,b)=>sb.from("casual_workers").select("*").gte("work_date",start).lte("work_date",end).order("work_date").order("created_at").range(a,b)))
  ]);
  const required=[["Milk log",milk],["Sales",sales]].filter(x=>!x[1].ok);
  if(required.length){
    const e=required[0][1].error||new Error("Couldn't load this month");
    e.message=required.map(x=>x[0]).join(", ")+": "+((e&&e.message)||"failed");
    throw e;
  }
  for(const k of Object.keys(state.milk)) if(k.split("|")[1].slice(0,7)===m){ delete state.milk[k]; delete state.milkPrices[k]; }
  milk.data.forEach(r=>{ const k=r.cow_id+"|"+r.entry_date; state.milk[k]=Number(r.litres); if(r.price_per_litre!=null) state.milkPrices[k]=Number(r.price_per_litre); });
  state.sales=state.sales.filter(x=>monthOf(x.d)!==m).concat(sales.data.map(saleFromRow));
  for(const k of Object.keys(state.feed)) if(k.split("|")[1].slice(0,7)===m) delete state.feed[k];
  if(feed.ok) feed.data.forEach(r=>{ state.feed[r.cow_id+"|"+r.entry_date]={silage:Number(r.silage_kg),other:Number(r.other_fodder_kg),otherType:r.other_fodder_type||"",meal:Number(r.dairy_meal_kg),supplement:Number(r.supplement_kg),silageCost:Number(r.silage_cost_per_kg||0),otherCost:Number(r.other_fodder_cost_per_kg||0),mealCost:Number(r.dairy_meal_cost_per_kg||0),supplementCost:Number(r.supplement_cost_per_kg||0)}; });
  for(const k of Object.keys(state.casual)) if(k.slice(0,7)===m) delete state.casual[k];
  if(casual.ok) casual.data.forEach(r=>{ state.casual[r.work_date]={count:r.casual_count,wage:Number(r.daily_wage)}; });
  if(costs.ok) state.costs=state.costs.filter(x=>monthOf(x.date)!==m).concat(costs.data.map(costFromRow));
  if(workers.ok) state.casualWorkers=state.casualWorkers.filter(x=>monthOf(x.work_date)!==m).concat(workers.data||[]);
  state.loadedMonths.add(m);
  const skipped=[["feed",feed],["casual labour",casual],["costs",costs],["casual workers",workers]].filter(x=>!x[1].ok);
  if(!skipped.length) return "";
  return "Some records could not be loaded ("+skipped.map(x=>x[0]).join(", ")+"). "+friendly(skipped[0][1].error);
}
const loadingMonths=new Set();
async function ensureMonth(m){
  if(state.loadedMonths.has(m)||loadingMonths.has(m)) return;
  loadingMonths.add(m);
  try{ await loadMonth(m); }catch(e){ state.error=friendly(e); }
  loadingMonths.delete(m);
  scheduleRender();
}
let reloading=false;
async function reloadAll(){
  if(reloading||state.auth!=="in"||!state.ready) return;
  reloading=true;
  try{
    const wasAdmin=state.admin;
    const w1=await loadCore();
    const ws=await Promise.all(Array.from(state.loadedMonths).map(loadMonth));
    if(state.admin&&state.tab==="members") await loadMembers();
    if(wasAdmin&&!state.admin) toast("Your administrator access was changed. The page permissions have been updated.",true);
    state.error=[w1].concat(ws).filter(Boolean).join(" ");
  }catch(e){}
  reloading=false; scheduleRender();
}
function subscribeRealtime(){}
function unsubscribeRealtime(){
  if(state.channel){ try{ sb.removeChannel(state.channel); }catch(e){} state.channel=null; }
}

const VIEWS=["log","herd","feed","daily","balances","farm","costlog","summary","members","locked"];
// Which page each section shows, and the label each tab takes in that section
// (the "daily" and "balances" pages are shared, filtered to that section's products)
const SECTION_TABS={
  farm:[["log","Milk log"],["herd","Herd"],["feed","Feed"],["daily","Milk sales & use"],["balances","Milk balance"],["costlog","Cost log"],["farm","Farm costs"]],
  shop:[["balances","Products"],["daily","Sales"]]
};
function canSeeFarm(){ return can("see_farm"); }
function canSeeShop(){ return can("see_shop"); }
function canSeeCosts(){ return can("manage_finance"); }
function sectionAllowed(section){
  if(section==="members") return !!state.admin;
  if(section==="summary") return canSeeFarm() && canSeeShop();
  if(section==="farm") return canSeeFarm();
  if(section==="shop") return canSeeShop();
  return false;
}
function tabsFor(section){
  const tabs=SECTION_TABS[section];
  if(!tabs) return null;
  if(section==="farm" && !canSeeCosts()) return tabs.filter(t=>t[0]!=="costlog" && t[0]!=="farm");
  return tabs;
}
function lockedHTML(section){
  const what=section==="shop"?"the shop":section==="farm"?"the farm":section==="summary"?"the summary":"this page";
  const both=!canSeeFarm() && !canSeeShop();
  return '<div class="auth" style="margin-top:12px"><h2>This page is not available</h2><p class="sub">'
    +(both
      ? "Your account can sign in, but you have not been given a role that opens the farm or the shop. Ask an administrator to assign a role with See the farm, See the shop, or both."
      : "You do not have access to "+what+". Ask an administrator to assign a role that includes it. Admins can open both the farm and the shop without an extra role.")
    +'</p></div>';
}
function sectionOf(tab){ return tab==="summary"?"summary":tab==="members"?"members":tab==="locked"?"locked":state.section; }
function renderAll(){
  renderWho(); renderBanner();
  const inApp=state.auth==="in";
  $(".tabs").hidden=!inApp;
  $("#view-auth").hidden=inApp;
  if(!inApp){
    VIEWS.forEach(t=>{ $("#view-"+t).hidden=true; });
    $("#subtabs").hidden=true;
    renderAuth(); return;
  }
  $("#sec-farm").hidden=false;
  $("#sec-shop").hidden=false;
  $("#sec-summary").hidden=!(canSeeFarm() && canSeeShop());
  $("#sec-members").hidden=!state.admin;
  if(state.section==="members" && !state.admin){
    state.section = canSeeFarm() ? "farm" : canSeeShop() ? "shop" : "locked";
  } else if(state.section==="summary" && !sectionAllowed("summary")){
    state.section = canSeeFarm() ? "farm" : canSeeShop() ? "shop" : "locked";
  }
  document.querySelectorAll('.tabs:not(.sub) > .tab').forEach(b=>b.setAttribute("aria-selected",String(b.dataset.section===state.section)));

  const subEl=$("#subtabs"), tabs=tabsFor(state.section);
  const pageDenied=state.section==="locked" || ((state.section==="farm" || state.section==="shop") && !sectionAllowed(state.section));
  if(pageDenied){
    subEl.hidden=true; subEl.innerHTML="";
    VIEWS.forEach(t=>{ $("#view-"+t).hidden = t!=="locked"; });
    $("#view-locked").innerHTML=lockedHTML(state.section==="locked"?"none":state.section);
    if(state.dlg && ["detail","profile","member-card"].indexOf(state.dlg.mode)>=0) renderDialog();
    return;
  }
  if(tabs){
    if(!tabs.some(t=>t[0]===state.tab)) state.tab=tabs[0][0];
    subEl.hidden=false;
    subEl.innerHTML=tabs.map(t=>'<button class="tab" role="tab" aria-selected="'+(t[0]===state.tab)+'" data-tab="'+t[0]+'">'+esc(t[1])+'</button>').join("");
  } else {
    subEl.hidden=true; subEl.innerHTML="";
    state.tab=state.section; // summary / members: the page IS the section
  }

  VIEWS.forEach(t=>{ $("#view-"+t).hidden = state.tab!==t; });
  if(state.tab==="log") renderLog();
  else if(state.tab==="herd") renderHerd();
  else if(state.tab==="feed") renderFeed();
  else if(state.tab==="daily") renderDaily();
  else if(state.tab==="balances") renderBalances();
  else if(state.tab==="farm") renderFarm();
  else if(state.tab==="costlog") renderCostLog();
  else if(state.tab==="members") renderMembers();
  else if(state.tab==="locked") { $("#view-locked").innerHTML=lockedHTML("none"); }
  else renderSummary();
  if(state.dlg && ["detail","profile","member-card"].indexOf(state.dlg.mode)>=0) renderDialog();
}

function renderBanner(){
  let msg="", cls="note", retry=false;
  if(state.error){ cls="error"; msg=state.error; retry=state.auth==="in"; }
  else if(state.auth==="loading"){ msg="Loading…"; }
  else if(state.auth==="in" && !state.ready){ msg="Loading farm records…"; }
  $("#banner").innerHTML = msg ? '<div class="'+cls+'" role="status">'+esc(msg)+(retry?' <button class="link" data-act="retry">Try again</button>':"")+'</div>' : "";
}

/* ----- Log in (role is read from the protected member profile) ----- */
function renderAuth(){
  const el=$("#view-auth");
  if(state.auth==="loading"){ el.innerHTML=""; el.dataset.key=""; return; }
  const key=state.auth+"|"+state.authTab+"|"+state.authNote;
  if(el.dataset.key===key) return;
  el.dataset.key=key;
  const note=state.authNote?'<div class="note" role="status">'+esc(state.authNote)+'</div>':"";
  let inner="";

function validEmail(s){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s); }

async function doLogin(){
  const email=$("#li-email").value.trim(), pass=$("#li-pass").value, btn=$("#authbtn");
  if(!validEmail(email)||!pass) return showErr("autherr","Enter your email and password.");
  $("#autherr").hidden=true; btn.disabled=true; btn.textContent="Logging in…";
  try{
    await run(sb.auth.signInWithPassword({email:email,password:pass}));
    // Optional repair if the profile row is missing. Older databases may not
    // have this function in the API schema cache yet — don't block login.
    try{ await tryRpc("ensure_my_profile"); }catch(e){}
    await loadProfile();
    if(!state.profile){
      const detail=state.profileError?" "+state.profileError:"";
      await sb.auth.signOut();
      throw new Error("We could not find this account's Brumac profile. Run the latest Supabase SQL update, then try again."+detail);
    }
    // The database role determines access. No role choice or PIN is needed.
    await enterApp();
  }catch(e){ showErr("autherr",friendly(e)); btn.disabled=false; btn.textContent="Log in"; }
}
async function doSignUp(){
  showErr("autherr","Public registration is disabled. Ask a Brumac administrator to create your account from the Members page.");
}

async function doForgot(){
  const email=$("#fg-email").value.trim(), btn=$("#authbtn");
  if(!validEmail(email)) return showErr("autherr","Enter a valid email address.");
  $("#autherr").hidden=true; btn.disabled=true; btn.textContent="Sending…";
  try{
    await run(sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname}));
    state.authNote="If that email has an account, a reset link is on its way."; state.authTab="login"; renderAuth();
  }catch(e){ showErr("autherr",friendly(e)); btn.disabled=false; btn.textContent="Send reset link"; }
}
async function doRecovery(){
  const p=$("#rc-pass").value, p2=$("#rc-pass2").value, btn=$("#authbtn");
  if(p.length<8) return showErr("autherr","Password must be at least 8 characters.");
  if(p!==p2) return showErr("autherr","The two passwords don't match.");
  $("#autherr").hidden=true; btn.disabled=true; btn.textContent="Saving…";
  try{
    await run(sb.auth.updateUser({password:p}));
    state.recovery=false;
    try{ history.replaceState(null,"",location.pathname); }catch(e){}
    try{ await sb.rpc("end_admin_session"); }catch(e){}
    toast("Password updated");
    await enterApp();
  }catch(e){ showErr("autherr",friendly(e)); btn.disabled=false; btn.textContent="Save password"; }
}

function renderLog(){
  const el=$("#view-log");
  if(!state.ready){ el.innerHTML=""; return; }
  if(!el.querySelector("#logbody")){
    el.innerHTML='<div class="logbar"><div><h2>Milk log</h2><p class="sub" id="logsub"></p></div>'
      +'<div class="field"><label for="logdate">Date</label><input type="date" id="logdate" max="'+todayStr()+'"></div></div><div id="logbody"></div>';
    $("#logdate").value=state.date;
  }
  $("#logsub").innerHTML='Enter the litres each cow gave. Milk is worth KES '+fmtL(milkPrice())+' a litre.'
    +(state.admin?' <button class="link" data-act="milk-price">Change price</button>':"");
  ensureMonth(monthOf(state.date));
  renderLogBody();
}

function currentValue(c){
  const key=state.date+"|"+c.id;
  if(key in state.draft){
    const raw=String(state.draft[key]).trim(); if(raw==="") return 0;
    const n=parseFloat(raw); return isFinite(n)&&n>=0?n:0;
  }
  return litresFor(c.id,state.date)||0;
}
function pendingChanges(){
  const out=[];
  for(const c of loggableCows()){
    const key=state.date+"|"+c.id;
    if(!(key in state.draft)) continue;
    const raw=String(state.draft[key]).trim(), saved=litresFor(c.id,state.date);
    if(raw===""){ if(saved!==null) out.push({id:c.id,value:null}); continue; }
    const n=parseFloat(raw); if(!isFinite(n)) continue;
    if(saved===null||round2(n)!==saved) out.push({id:c.id,value:round2(n)});
  }
  return out;
}
function validateDraft(){
  for(const c of loggableCows()){
    const key=state.date+"|"+c.id;
    if(!(key in state.draft)) continue;
    const raw=String(state.draft[key]).trim(); if(raw==="") continue;
    const n=parseFloat(raw);
    if(!isFinite(n)||n<0) return "Enter litres as a number, 0 or more, for "+cowLabel(c)+".";
    if(n>MAX_LITRES) return cowLabel(c)+": "+raw+" litres looks too high. One cow can't give more than "+MAX_LITRES+" litres a day.";
  }
  return "";
}

function rowHTML(c){
  const saved=litresFor(c.id,state.date), key=state.date+"|"+c.id;
  const val = key in state.draft ? state.draft[key] : (saved===null?"":String(saved));
  const n=parseFloat(val), kes=isFinite(n)&&n>0?fmtKES(n*priceFor(c.id,state.date)):"";
  const meta=[c.name?"Tag "+c.tag:"",c.breed||"",c.status&&c.status!=="milking"?label(STATUSES,c.status):""].filter(Boolean).join(", ");
  const editing=!!state.milkEditing[c.id];
  return '<div class="row">'+coat(c.id,44)
    +'<div><div class="nm">'+esc(cowLabel(c))+'</div><div class="meta">'+esc(meta)+'</div></div>'
    +'<div class="entry"><div class="lit"><input type="number" inputmode="decimal" min="0" max="'+MAX_LITRES+'" step="any" placeholder="0" data-cow="'+esc(c.id)+'" aria-label="Litres from '+esc(cowLabel(c))+'" value="'+esc(val)+'"'+(editing?"":" disabled")+'><span>L</span></div><button class="btn ghost small" type="button" data-act="edit-milk-row" data-id="'+esc(c.id)+'" data-editing="'+(editing?"1":"0")+'">'+(editing?"Save log":"Edit log")+'</button>'
    +'<div class="kes" data-kes="'+esc(c.id)+'">'+kes+'</div></div></div>';
}

function renderLogBody(){
  const body=$("#logbody"); if(!body) return;
  const active=document.activeElement, keep=(active&&active.dataset&&active.dataset.cow&&body.contains(active))?active.dataset.cow:null;
  const cows=loggableCows();
  let html="";
  if(!cows.length){
    html+='<div class="ledger"><div class="empty"><p>'+(can("edit_herd")?"There are no cows in the herd yet. Add a cow, then come back to record milk.":"There are no cows in the herd yet. An admin needs to add them first.")+'</p>'+(can("edit_herd")?'<button class="btn" data-act="goto-herd">Go to herd</button>':"")+'</div></div>';
  } else {
    html+='<div class="ledger">'+cows.map(rowHTML).join("")+'</div>';
    html+='<div class="total"><div><div class="eq">Total for '+esc(fmtDate(state.date,{weekday:"short",day:"numeric",month:"short"}))+'</div><div class="big" id="tot-kes"></div><div class="eq" id="tot-l"></div></div>'
      +'<button class="btn" id="savemilk" data-act="save-milk">Save milk</button></div>'
      +'<div class="error" id="logerr" role="alert" hidden></div>';
  }
  body.innerHTML=html;
  updateTotals();
  if(keep){ const inp=body.querySelector('input[data-cow="'+CSS.escape(keep)+'"]'); if(inp) inp.focus(); }
}

function updateTotals(){
  const k=$("#tot-kes"); if(!k) return;
  let l=0, kes=0; for(const c of loggableCows()){ const v=currentValue(c); l+=v; kes+=v*priceFor(c.id,state.date); }
  k.textContent=fmtKES(kes);
  $("#tot-l").textContent=fmtL(l)+" litres recorded";
  const b=$("#savemilk"); if(b){ b.disabled = state.saving || pendingChanges().length===0; b.textContent = state.saving?"Saving…":"Save milk"; }
}

async function saveMilk(){
  const errEl=$("#logerr"), err=validateDraft();
  if(err){ errEl.textContent=err; errEl.hidden=false; return; }
  errEl.hidden=true;
  const changes=pendingChanges(); if(!changes.length) return;
  state.saving=true; updateTotals();
  const date=state.date;
  try{
    const ups=changes.filter(c=>c.value!==null).map(c=>({cow_id:c.id,entry_date:date,litres:c.value}));
    if(ups.length) await run(sb.from("milk_entries").upsert(ups,{onConflict:"cow_id,entry_date"}));
    for(const d of changes.filter(c=>c.value===null)) await run(sb.from("milk_entries").delete().eq("cow_id",d.id).eq("entry_date",date));
    changes.forEach(c=>{
      const k=c.id+"|"+date;
      if(c.value===null){ delete state.milk[k]; delete state.milkPrices[k]; }
      else { state.milk[k]=c.value; if(!(k in state.milkPrices)) state.milkPrices[k]=milkPrice(); }
      delete state.draft[date+"|"+c.id];
    });
    if(date===todayStr()){ try{ await loadCore(); }catch(_){} }
    state.milkEditing={};
    toast("Milk saved");
  }catch(e){ toast("Couldn't save the milk. "+friendly(e),true); }
  state.saving=false;
  renderLogBody();
}

/* ----- Feed: fodder, dairy meal and supplements ----- */
function feedFor(cowId,date){ return state.feed[cowId+"|"+date]||{silage:0,other:0,otherType:"",meal:0,supplement:0,silageCost:0,otherCost:0,mealCost:0,supplementCost:0}; }
function renderFeed(){
  const el=$("#view-feed");
  if(!state.ready){ el.innerHTML=""; return; }
  if(!el.querySelector("#feedbody")){
    el.innerHTML='<div class="logbar"><div><h2>Feed</h2><p class="sub">Record what each cow ate today: fodder, dairy meal and supplements.</p></div>'
      +'<div class="field"><label for="feeddate">Date</label><input type="date" id="feeddate" max="'+todayStr()+'"></div></div><div id="feedbody"></div>';
    $("#feeddate").value=state.careDate;
  }
  ensureMonth(monthOf(state.careDate));
  // While a row is open for editing, do not rebuild the inputs (that was
  // stealing focus and making typing impossible).
  if(Object.keys(state.feedEditing).length){
    updateFeedButton();
    return;
  }
  renderFeedBody();
}
function feedValue(cowId,field){
  const key=state.careDate+"|"+cowId+"|"+field;
  if(key in state.feedDraft) return state.feedDraft[key];
  const v=feedFor(cowId,state.careDate)[field];
  return field==="otherType" ? (v||"") : (v?String(v):"");
}
function feedRowHTML(c){
  const meta=[c.name?"Tag "+c.tag:"",c.breed||""].filter(Boolean).join(", ");
  const editing=!!state.feedEditing[c.id];
  const dis=editing?"":" disabled";
  const num=(field,label,ph)=>'<div class="f"><label for="feed-'+field+'-'+esc(c.id)+'">'+label+'</label><input type="number" inputmode="decimal" min="0" step="any" placeholder="'+(ph||"0")+'" id="feed-'+field+'-'+esc(c.id)+'" data-cow="'+esc(c.id)+'" data-field="'+field+'" value="'+esc(feedValue(c.id,field))+'"'+dis+'></div>';
  return '<div class="care" data-cow-row="'+esc(c.id)+'">'+coat(c.id,44)
    +'<div style="min-width:120px;flex:none"><div class="nm">'+esc(cowLabel(c))+'</div><div class="meta">'+esc(meta)+'</div><button class="btn ghost small" type="button" data-act="edit-feed-row" data-id="'+esc(c.id)+'" data-editing="'+(editing?"1":"0")+'">'+(editing?"Done editing":"Edit feed")+'</button></div>'
    +'<div class="cf">'+num("silage","Silage (kg)")+num("other","Other fodder (kg)")
    +'<div class="f"><label for="feed-otherType-'+esc(c.id)+'">Other fodder type</label><input type="text" maxlength="40" placeholder="Napier grass" id="feed-otherType-'+esc(c.id)+'" data-cow="'+esc(c.id)+'" data-field="otherType" value="'+esc(feedValue(c.id,"otherType"))+'"'+dis+'></div>'
    +num("meal","Dairy meal (kg)")+num("supplement","Supplements (kg)")+num("silageCost","Silage cost/kg (KES)")+num("otherCost","Other fodder cost/kg (KES)")+num("mealCost","Dairy meal cost/kg (KES)")+num("supplementCost","Supplement cost/kg (KES)")+'</div></div>';
}
function feedPending(){
  const out=[];
  for(const c of state.cows){
    const key=(f)=>state.careDate+"|"+c.id+"|"+f, cur=feedFor(c.id,state.careDate);
    const vals={};
    let changed=false, hasVal=false;
    ["silage","other","meal","supplement","silageCost","otherCost","mealCost","supplementCost"].forEach(f=>{
      const raw=key(f) in state.feedDraft ? state.feedDraft[key(f)] : String(cur[f]||"");
      const n=parseFloat(raw)||0;
      vals[f]=n; if(n>0) hasVal=true;
      if(n!==(cur[f]||0)) changed=true;
    });
    const rawType=key("otherType") in state.feedDraft ? state.feedDraft[key("otherType")] : (cur.otherType||"");
    vals.otherType=rawType.trim();
    if(vals.otherType!==(cur.otherType||"")) changed=true;
    if(changed&&(hasVal||cur.silage||cur.other||cur.meal||cur.supplement)) out.push({id:c.id,vals:vals});
  }
  return out;
}
function validateFeed(){
  for(const c of state.cows){
    const g=f=>{ const k=state.careDate+"|"+c.id+"|"+f; return k in state.feedDraft ? state.feedDraft[k] : String(feedFor(c.id,state.careDate)[f]||""); };
    for(const f of ["silage","other","meal","supplement"]){
      const raw=g(f); if(raw==="") continue;
      const n=parseFloat(raw), max=(f==="silage"||f==="other")?200:50;
      if(!isFinite(n)||n<0) return cowLabel(c)+": enter "+f+" as a number, 0 or more.";
      if(n>max) return cowLabel(c)+": that "+f+" amount looks too high.";
    }
  }
  return "";
}
function renderFeedBody(){
  const body=$("#feedbody"); if(!body) return;
  const active=document.activeElement;
  const keepId=active&&active.dataset?active.dataset.field:null;
  const keepCow=active&&active.dataset?active.dataset.cow:null;
  const keepStart=(active&&typeof active.selectionStart==="number")?active.selectionStart:null;
  const keepEnd=(active&&typeof active.selectionEnd==="number")?active.selectionEnd:null;
  const cows=sortedCows(state.cows);
  let html="";
  if(!cows.length){
    html='<div class="ledger"><div class="empty"><p>There are no cows in the herd yet.</p></div></div>';
  } else {
    html='<div class="ledger">'+cows.map(feedRowHTML).join("")+'</div>';
    let ts=0,to=0,tm=0,tp=0,feedCost=0;
    for(const c of cows){
      // Prefer in-progress draft values so totals stay live while editing
      const f=feedFor(c.id,state.careDate);
      const n=field=>{ const k=state.careDate+"|"+c.id+"|"+field; return k in state.feedDraft ? (parseFloat(state.feedDraft[k])||0) : (f[field]||0); };
      const silage=n("silage"), other=n("other"), meal=n("meal"), supplement=n("supplement");
      const silageCost=n("silageCost"), otherCost=n("otherCost"), mealCost=n("mealCost"), supplementCost=n("supplementCost");
      ts+=silage; to+=other; tm+=meal; tp+=supplement;
      feedCost+=silage*silageCost+other*otherCost+meal*mealCost+supplement*supplementCost;
    }
    html+='<div class="total"><div><div class="eq">Total for '+esc(fmtDate(state.careDate,{weekday:"short",day:"numeric",month:"short"}))+'</div>'
      +'<div class="eq">'+fmtL(ts)+' kg silage, '+fmtL(to)+' kg other fodder, '+fmtL(tm)+' kg dairy meal, '+fmtL(tp)+' kg supplements</div>'+'<div class="eq">Estimated feed cost: <b>'+esc(fmtKES(feedCost))+'</b></div></div>'
      +'<button class="btn" id="savefeed" data-act="save-feed">Save feed</button></div>'
      +'<div class="error" id="feederr" role="alert" hidden></div>';
  }
  body.innerHTML=html;
  updateFeedButton();
  if(keepCow&&keepId){
    const inp=document.getElementById("feed-"+keepId+"-"+keepCow);
    if(inp){
      inp.focus();
      try{ if(keepStart!=null) inp.setSelectionRange(keepStart,keepEnd!=null?keepEnd:keepStart); }catch(e){}
    }
  }
}
function updateFeedButton(){
  const b=$("#savefeed"); if(!b) return;
  b.disabled=state.saving||feedPending().length===0; b.textContent=state.saving?"Saving…":"Save feed";
}
function updateFeedTotals(){
  const box=$("#feedbody .total"); if(!box) return;
  const cows=sortedCows(state.cows);
  let ts=0,to=0,tm=0,tp=0,feedCost=0;
  for(const c of cows){
    const f=feedFor(c.id,state.careDate);
    const n=field=>{ const k=state.careDate+"|"+c.id+"|"+field; return k in state.feedDraft ? (parseFloat(state.feedDraft[k])||0) : (f[field]||0); };
    const silage=n("silage"), other=n("other"), meal=n("meal"), supplement=n("supplement");
    const silageCost=n("silageCost"), otherCost=n("otherCost"), mealCost=n("mealCost"), supplementCost=n("supplementCost");
    ts+=silage; to+=other; tm+=meal; tp+=supplement;
    feedCost+=silage*silageCost+other*otherCost+meal*mealCost+supplement*supplementCost;
  }
  const eq=box.querySelectorAll(".eq");
  if(eq[1]) eq[1].textContent=fmtL(ts)+" kg silage, "+fmtL(to)+" kg other fodder, "+fmtL(tm)+" kg dairy meal, "+fmtL(tp)+" kg supplements";
  if(eq[2]) eq[2].innerHTML="Estimated feed cost: <b>"+esc(fmtKES(feedCost))+"</b>";
}
async function saveFeed(){
  const errEl=$("#feederr"), err=validateFeed();
  if(err){ errEl.textContent=err; errEl.hidden=false; return; }
  errEl.hidden=true;
  const changes=feedPending(); if(!changes.length) return;
  state.saving=true; updateFeedButton();
  const date=state.careDate;
  try{
    const rows=changes.map(c=>({cow_id:c.id,entry_date:date,silage_kg:round2(c.vals.silage),other_fodder_kg:round2(c.vals.other),other_fodder_type:c.vals.otherType||null,dairy_meal_kg:round2(c.vals.meal),supplement_kg:round2(c.vals.supplement),silage_cost_per_kg:round2(c.vals.silageCost),other_fodder_cost_per_kg:round2(c.vals.otherCost),dairy_meal_cost_per_kg:round2(c.vals.mealCost),supplement_cost_per_kg:round2(c.vals.supplementCost)}));
    await run(sb.from("cow_feed").upsert(rows,{onConflict:"cow_id,entry_date"}));
    changes.forEach(c=>{
      state.feed[c.id+"|"+date]={silage:c.vals.silage,other:c.vals.other,otherType:c.vals.otherType,meal:c.vals.meal,supplement:c.vals.supplement,silageCost:c.vals.silageCost,otherCost:c.vals.otherCost,mealCost:c.vals.mealCost,supplementCost:c.vals.supplementCost};
      ["silage","other","meal","supplement","otherType","silageCost","otherCost","mealCost","supplementCost"].forEach(f=>{ delete state.feedDraft[date+"|"+c.id+"|"+f]; });
    });
    state.feedEditing={};
    toast("Feed saved");
  }catch(e){ toast("Couldn't save the feed. "+friendly(e),true); }
  state.saving=false;
  renderFeedBody();
}

const UNIT_WORD={kg:"kg",litre:"litre",piece:"piece",bag:"bag",bunch:"bunch",packet:"packet",L:"litre"};
function unitWord(u){ return UNIT_WORD[u]||u; }
// Stock value = buying price x quantity in stock
function stockCost(r){ return Math.max(0,r.qty)*(r.buyingPrice||0); }
function allStockRows(){
  const rows=[{kind:"milk",id:null,name:"Milk",unit:"L",price:milkPrice(),qty:state.settings.milkStock}];
  sortedCereals().forEach(c=>rows.push({kind:"cereal",id:c.id,name:c.name,unit:c.unit,price:c.price,buyingPrice:c.buyingPrice||0,qty:c.qty}));
  return rows;
}
// Farm's balance page shows only milk; Shop's shows only shop products
function stockRows(){
  return allStockRows().filter(r=>state.section==="farm"?r.kind==="milk":r.kind!=="milk");
}
function findStock(kind,id){ return allStockRows().find(r=>r.kind===kind&&(r.id||"")===(id||"")); }
function shopSearchHTML(){
  const q=state.shopQuery||"";

    +'<button type="button" class="s-clear" data-act="clear-shop-search" aria-label="Clear search">×</button></div>';
}
function filteredShopRows(){
  let rows=stockRows();
  if(state.section==="shop"){
    const terms=(state.shopQuery||"").trim().toLowerCase().split(/\s+/).filter(Boolean);

      rows=rows.filter(r=>{
        const hay=(String(r.name)+" "+String(r.unit)+" "+unitWord(r.unit)).toLowerCase();
        return terms.every(term=>hay.includes(term));

}

function renderFarm(){
  const el=$("#view-farm");
  if(!state.ready){ el.innerHTML=""; return; }
  if(!canSeeCosts()){ el.innerHTML=lockedHTML("farm"); return; }
  ensureMonth(monthOf(state.casualDate));
  const fin=can("manage_finance"), canId=fin||state.admin;
  let html='<h2>Farm costs</h2><p class="sub" style="margin:4px 0 18px">Tap a section to open it. '+(fin?"":"Admins and finance roles keep this up to date.")+'</p><div class="acc">';

  // 1. Inputs & farm expenditures (includes the farm identity)
  let lf=state.costLand; if(lf!=="all"&&lf!=="none"&&!findLand(lf)) lf="all";
  const costs=state.costs.filter(c=>lf==="all"||(lf==="none"?!c.landId:c.landId===lf)).sort((a,b)=>b.date<a.date?-1:b.date>a.date?1:0);

  const nm=state.settings.farmName, loc=state.settings.location, notes=state.settings.farmNotes;
  let b='<div class="subhead"><h4>Farm identity</h4>'+(canId?'<button class="btn ghost small" data-act="identity-edit">Edit</button>':'')+'</div>'
    +'<div class="idcard"><div class="idrow"><div><div class="meta">Farm name</div><div class="nm">'+esc(nm||"Not set")+'</div></div>'
    +'<div><div class="meta">Location</div><div class="nm">'+esc(loc||"Not set")+'</div></div></div>'
    +(notes?'<div class="idnotes"><div class="meta">Notes</div><div>'+esc(notes)+'</div></div>':'')+'</div>'
    +'<div class="subhead"><h4>Expenditure records</h4>'+(fin?'<button class="btn small" data-act="cost-add" data-land="'+(lf!=="all"&&lf!=="none"?esc(lf):"")+'">Add expenditure</button>':'')+'</div>'
    +landChipsHTML()
    +'<p class="sub" style="margin:-4px 0 12px">Seeds, land preparation, fertilizer, manure, herbicides, pesticides, veterinary, transport, equipment, utilities, feed and any other cost, each recorded on its own.</p>';
  if(!costs.length) b+='<div class="emptycard">No costs recorded yet.</div>';
  else b+='<div class="cardgrid">'+costs.map(c=>costCardHTML(c,fin)).join("")+'</div><p class="sumline">Total (loaded months): <b>'+fmtKES(costTotal)+'</b></p>';
  html+=accItemHTML("inputs","Inputs & farm expenditures",esc(state.settings.farmName?state.settings.farmName+" · ":"")+costs.length+(costs.length===1?" record":" records")+" · "+esc(fmtKES(costTotal)),b);

  // 2. Permanent staff
  let monthly=0, daily=0; state.staff.forEach(s=>{ if(s.period==="daily") daily+=s.wage; else monthly+=s.wage; });
  const staffBits=[]; if(monthly>0) staffBits.push(fmtKES(monthly)+" / month"); if(daily>0) staffBits.push(fmtKES(daily)+" / day");
  b='<div class="subhead"><h4>Staff list</h4>'+(fin?'<button class="btn small" data-act="staff-add">Add staff</button>':'')+'</div>'
    +(state.staff.length?'<div class="cardgrid">'+state.staff.map(staffRowHTML).join("")+'</div>':'<div class="emptycard">No permanent staff added yet.</div>');
  html+=accItemHTML("staff","Permanent staff",state.staff.length+(state.staff.length===1?" member":" members")+(staffBits.length?" · "+esc(staffBits.join(" + ")):""),b);

  // 3. Casual labourers (for the chosen date)
  const workers=state.casualWorkers.filter(w=>w.work_date===state.casualDate);
  const laborTotal=workers.reduce((sum,w)=>sum+Number(w.daily_wage||0),0);
  b='<div class="subhead"><h4>Casual workers</h4><div class="field" style="min-width:160px"><label for="casualdate">Date</label><input type="date" id="casualdate" max="'+todayStr()+'" value="'+state.casualDate+'"></div></div>';
  if(fin){
    b+='<form id="casualworkerform" class="salecard" novalidate><div class="grid2"><div class="field"><label for="cw-name">Casual worker name</label><input id="cw-name" type="text" maxlength="80" required></div><div class="field"><label for="cw-wage">Daily wage (KES)</label><input id="cw-wage" type="number" min="0" step="any" value="0" required></div><div class="field full"><label for="cw-task">Task description</label><textarea id="cw-task" maxlength="500" required placeholder="e.g. Cleaning the cowshed, cutting Napier grass..."></textarea></div></div><div class="error" id="cw-err" hidden></div><button class="btn" type="submit" style="margin-top:12px">Add casual worker</button></form>';
  }
  b+=workers.length?'<div class="cardgrid">'+workers.map(w=>casualCardHTML(w,fin)).join("")+'</div>':'<div class="emptycard">No casual workers recorded for '+esc(fmtDate(state.casualDate))+'.</div>';
  b+='<p class="sumline">Casual labour total: <b>'+fmtKES(laborTotal)+'</b> · '+workers.length+' worker(s)</p>';
  html+=accItemHTML("casual","Casual labourers",workers.length+(workers.length===1?" worker":" workers")+" on "+esc(fmtDate(state.casualDate,{day:"numeric",month:"short"}))+" · "+esc(fmtKES(laborTotal)),b);

  // 4. Farm lands
  const totAcres=state.lands.reduce((x,l)=>x+l.acres,0), totHire=totalLandHire();
  b='<div class="subhead"><h4>Your lands</h4>'+(fin?'<button class="btn small" data-act="land-add">Add land</button>':'')+'</div>'

  html+=accItemHTML("land","Farm lands",state.lands.length+(state.lands.length===1?" land":" lands")+" · "+esc(fmtL(totAcres))+" acres · "+esc(fmtKES(totHire)),b);

  html+='</div>';
  el.innerHTML=html;
}

/* ----- Daily summary (Milk sales under Farm, Shop sales under Shop) ----- */
function nowClock(){ const d=new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); }
function productName(x){ if(x.kind==="milk") return "Milk"; const c=findCereal(x.cerealId); return c?c.name:"Product"; }
function productUnit(x){ return x.kind==="milk"?"L":unitWord((findCereal(x.cerealId)||{}).unit); }
// Farm's Sales page only offers Milk; Shop's offers every shop product
function productList(){
  return allStockRows().filter(r=>state.section==="farm"?r.kind==="milk":r.kind!=="milk")
    .map(r=>({value:r.kind==="milk"?"milk":"c:"+r.id, kind:r.kind, id:r.id, name:r.name, unit:r.unit, price:r.price, qty:r.qty}));
}
function selectedProduct(){

async function loadMilkBalanceSummary(){
  const box=$("#milk-balance-summary"); if(!box||!state.ready) return;
  try{
    const d=state.salesDate;
    // When viewing today, force the database stock to match today's production
    // minus all allocations and sales (prevents yesterday's leftover showing).
    if(d===todayStr()){
      try{
        const stock=await run(sb.rpc("refresh_milk_stock"));
        if(typeof stock==="number") state.settings.milkStock=stock;
      }catch(e){}
    }
    const [milk,alloc,sales]=await Promise.all([
      run(sb.from("milk_entries").select("litres").eq("entry_date",d)),
      run(sb.from("milk_allocations").select("allocation_type,quantity_litres").eq("allocation_date",d)),
      run(sb.from("sales").select("quantity").eq("product_kind","milk").eq("sold_on",d))
    ]);
    const produced=(milk||[]).reduce((a,r)=>a+Number(r.litres||0),0);
    // All allocation types (including co-op and direct) take milk out of stock
    const used=(alloc||[]).reduce((a,r)=>a+Number(r.quantity_litres||0),0);
    const sold=(sales||[]).reduce((a,r)=>a+Number(r.quantity||0),0);
    const available=Math.max(0,round2(produced-used-sold));
    if(d===todayStr()) state.settings.milkStock=available;
    box.innerHTML='<b>Milk balance for '+esc(fmtDate(d))+'</b><br>Produced by all cows: '+fmtL(produced)+' L · Allocated / used: '+fmtL(used)+' L · Recorded milk sales: '+fmtL(sold)+' L<br><strong>Available to sell: '+fmtL(available)+' L</strong>';
    if(d===todayStr()&&state.tab==="balances"&&state.section==="farm") renderBalances();
  }catch(e){ box.textContent="Automatic milk balance is unavailable. Check the database permissions and SQL setup."; }
}

async function recordSaleFromForm(){
  const errEl=$("#saleerr"), btn=$("#salebtn"); errEl.hidden=true;
  const p=selectedProduct(), n=parseFloat(state.sale.qty), time=state.sale.time;
  const isToday=state.salesDate===todayStr();
  const fail=m=>{ errEl.textContent=m; errEl.hidden=false; };
  if(!p) return fail("Choose a product.");
  if(!(n>0)) return fail("Enter the quantity sold.");
  if(n>MAX_KG) return fail("That quantity is too large.");
  // Stock check: always for shop products; for milk only when recording for today
  // (past-day milk sales do not touch today's live stock balance)
  if(p.kind!=="milk"||isToday){
    if(p.qty<=0) return fail(p.name+" is out of stock.");
    if(n>p.qty+1e-9) return fail("Only "+fmtL(p.qty)+" "+unitWord(p.unit)+" of "+p.name+" is left. You entered "+fmtL(n)+".");
  }
  if(!/^\d{2}:\d{2}$/.test(time||"")) return fail("Enter the time of the sale.");
  // Build timestamp from the selected sales date + the time of day
  const t=time.split(":").map(Number);
  const dayParts=state.salesDate.split("-").map(Number);
  const when=new Date(dayParts[0],dayParts[1]-1,dayParts[2],t[0],t[1],0,0);
  if(when.getTime()>Date.now()+5*60000) return fail("The time can't be in the future.");
  let file=receiptRequired()?state.receiptFile:null;
  if(receiptRequired()&&!file) return fail(p.kind==="milk"?"Attach a photo of the receipt. Every milk sale needs one.":"Attach a photo of the receipt for sales on previous days.");
  btn.disabled=true; btn.textContent=file?"Preparing receipt…":"Recording…";
  if(file){
    file=await compressReceipt(file);
    if(file.size>5*1024*1024){ btn.disabled=false; btn.textContent="Record sale"; return fail("Receipt photo must be under 5 MB."); }
    btn.textContent="Uploading receipt…";
  }
  try{
    let receiptPath=null;
    if(file){
      const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,5)||"jpg";
      const path=(state.user&&state.user.id?state.user.id:"anon")+"/"+state.salesDate+"_"+Date.now()+"."+ext;
      const up=await sb.storage.from("receipts").upload(path,file,{contentType:file.type||"image/jpeg",upsert:false});
      if(up.error) throw up.error;
      receiptPath=path;
    }
    btn.textContent="Recording…";
    await run(sb.rpc("record_sale",{
      p_kind:p.kind,
      p_cereal_id:p.id,
      p_qty:round2(n),
      p_sold_at:when.toISOString(),
      p_receipt_path:receiptPath,
      p_pack_id:null
    }));
    state.sale.qty=""; state.sale.time=nowClock(); state.sale.query=""; state.sale.open=false; state.sale.hi=0;
    if($("#s-qty")) $("#s-qty").value="";
    if($("#s-time")) $("#s-time").value=state.sale.time;
    setReceiptFile(null);
    await loadCore();
    await loadMonth(monthOf(state.salesDate));
    if(monthOf(state.salesDate)!==monthOf(todayStr())) await loadMonth(monthOf(todayStr()));
    toast("Sale recorded");
  }catch(e){ fail(friendly(e)); }
  btn.disabled=false; btn.textContent="Record sale";
  refreshSaleForm(); renderDailyBody();
  if(state.section==="farm") loadMilkBalanceSummary();
}

// Shrink big phone photos before upload (keeps them readable, well under the 5 MB limit)
async function compressReceipt(file){
  try{
    if(!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
    const bmp=await createImageBitmap(file);
    const scale=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    if(scale===1&&file.size<=1.5*1024*1024){ if(bmp.close) bmp.close(); return file; }
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*scale); c.height=Math.round(bmp.height*scale);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height); if(bmp.close) bmp.close();
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.82));
    if(!blob||blob.size>=file.size) return file;
    return new File([blob],(file.name||"receipt").replace(/\.[^.]+$/,"")+".jpg",{type:"image/jpeg"});
  }catch(e){ return file; }
}

/* ----- Cost log: daily, weekly, monthly and annual input/labour costs ----- */
function costRange(period, anchor){
  const d=parseDate(anchor); let start=anchor,end=anchor;
  if(period==="weekly"){
    const offset=(d.getDay()+6)%7; start=addDays(anchor,-offset); end=addDays(start,6);
  }else if(period==="monthly"){
    start=anchor.slice(0,7)+"-01"; end=anchor.slice(0,7)+"-"+pad(daysInMonth(anchor.slice(0,7)));
  }else if(period==="annual"){
    start=d.getFullYear()+"-01-01"; end=d.getFullYear()+"-12-31";
  }
  if(end>todayStr()) end=todayStr();
  return {start,end};
}

      +'<button class="btn ghost" type="button" data-act="refresh-costlog">Refresh</button></div>'

    $("#costperiod").value=state.costPeriod||"daily"; $("#costdate").value=state.costDate||todayStr();

    loadCostReport();

      fetchAll((a,b)=>sb.from("cow_feed").select("entry_date,silage_kg,other_fodder_kg,dairy_meal_kg,supplement_kg,silage_cost_per_kg,other_fodder_cost_per_kg,dairy_meal_cost_per_kg,supplement_cost_per_kg").gte("entry_date",start).lte("entry_date",end).order("entry_date").range(a,b)),
      fetchAll((a,b)=>sb.from("casual_workers").select("work_date,daily_wage").gte("work_date",start).lte("work_date",end).order("work_date").range(a,b))
    ]);
    const days={}; const getDay=d=>days[d]||(days[d]={silage:0,fodder:0,meal:0,supplements:0,labor:0,total:0});

    workers.forEach(r=>{getDay(r.work_date).labor+=Number(r.daily_wage||0);});
