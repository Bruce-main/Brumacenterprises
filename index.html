// What the farm spent in a month: feed, casual labour, permanent staff, land hire and recorded expenditures
function farmCostsFor(m){
  const dim=daysInMonth(m), cur=m===todayStr().slice(0,7);
  let feed=0;
  for(const k in state.feed){
    const i=k.indexOf("|"); if(k.slice(i+1,i+8)!==m) continue;
    const f=state.feed[k];
    feed+=f.silage*f.silageCost+f.other*f.otherCost+f.meal*f.mealCost+f.supplement*f.supplementCost;
  }
  const casual=state.casualWorkers.filter(w=>monthOf(w.work_date)===m).reduce((a,w)=>a+Number(w.daily_wage||0),0);
  const days=cur?parseInt(todayStr().slice(8,10),10):dim;
  const staff=state.staff.filter(s=>s.active!==false).reduce((a,s)=>a+(s.period==="daily"?s.wage*days:s.wage),0);
  const land=totalLandHire();
  const other=state.costs.filter(c=>monthOf(c.date)===m).reduce((a,c)=>a+c.amount,0);
  feed=round2(feed);
  return {feed:feed,casual:round2(casual),staff:round2(staff),land:round2(land),other:round2(other),total:round2(feed+casual+staff+land+other)};
}
function pctOf(profit,rev){ return rev>0 ? num(profit/rev*100)+"%" : "–"; }
function marginCardHTML(title,profit,rev,cost,costWord,cls){
  return '<div class="mcard '+(cls||"")+'"><div class="mlbl">'+esc(title)+'</div>'
    +'<div class="mval'+(profit<0?" neg":"")+'">'+esc(fmtKES(profit))+'</div>'
    +'<div class="mpct">'+esc(pctOf(profit,rev))+' margin</div>'
    +'<div class="meqn">'+esc(fmtKES(rev))+' sales − '+esc(fmtKES(cost))+' '+esc(costWord)+'</div></div>';
}
function renderSummary(){
  const el=$("#view-summary");
  if(!state.ready){ el.innerHTML=""; return; }
  const m=state.month, dim=daysInMonth(m), isCurrent=m>=todayStr().slice(0,7);
  let html='<div class="monthbar"><div class="lbl">'+esc(monthLabel(m))+'</div><div class="monthbtns">'
    +'<button class="btn ghost" data-act="prev-month">Previous month</button>'
    +'<button class="btn ghost" data-act="next-month"'+(isCurrent?" disabled":"")+'>Next month</button></div></div>';
  if(!state.loadedMonths.has(m)){
    ensureMonth(m);
    el.innerHTML=html+'<div class="note" style="margin-top:14px">Loading '+esc(monthLabel(m))+'…</div>'; return;
  }
  const showM=canSeeCosts();
  const perDay=new Array(dim).fill(0), perCowMap={};
  let totalKes=0;
  for(const k in state.milk){
    const i=k.indexOf("|"); if(k.slice(i+1,i+8)!==m) continue;
    const cowId=k.slice(0,i), dateStr=k.slice(i+1), day=parseInt(dateStr.slice(8,10),10), v=state.milk[k];
    if(!(day>=1&&day<=dim)||!findCow(cowId)) continue;
    const val=v*priceFor(cowId,dateStr);
    perDay[day-1]+=v; totalKes+=val;
    const a=perCowMap[cowId]||(perCowMap[cowId]={c:findCow(cowId),l:0,days:0,kes:0}); a.l+=v; a.kes+=val; if(v>0) a.days++;
  }
  const perCow=Object.keys(perCowMap).map(k=>perCowMap[k]).filter(p=>p.l>0).sort((a,b)=>b.l-a.l);
  const total=round2(perDay.reduce((a,b)=>a+b,0));

  html+='<h3 class="sec">Milk produced</h3>';
  if(total<=0){
    html+='<div class="ledger"><div class="empty"><p>No milk was recorded in '+esc(monthLabel(m))+'.</p></div></div>';
  } else {
    html+='<p class="sumline" style="margin-top:0"><b>'+fmtL(total)+' litres</b> recorded, worth <b>'+fmtKES(totalKes)+'</b>.</p>';
    const items=perDay.map((v,i)=>({v:v,t:fmtDate(m+"-"+pad(i+1),{day:"numeric",month:"short"})+": "+fmtL(v)+" L"}));
    html+=bars(items,"Litres of milk per day in "+monthLabel(m),"1 "+fmtDate(m+"-01",{month:"short"}),dim+" "+fmtDate(m+"-01",{month:"short"}));
    html+='<div class="scroll"><table><thead><tr><th>Cow</th><th>Days recorded</th><th>Litres</th><th>Average a day</th><th>Value</th></tr></thead><tbody>'
      +perCow.map(p=>'<tr><td>'+esc(cowLabel(p.c))+'</td><td>'+p.days+'</td><td>'+fmtL(p.l)+'</td><td>'+(p.days?fmtL(p.l/p.days):"")+'</td><td>'+fmtKES(p.kes)+'</td></tr>').join("")
      +'</tbody><tfoot><tr><td>Whole herd</td><td></td><td>'+fmtL(total)+'</td><td></td><td>'+fmtKES(totalKes)+'</td></tr></tfoot></table></div>';
  }

  html+='<h3 class="sec">Milk sales</h3>';
  const milkAgg={qty:0,kes:0};
  for(const e of state.sales){ if(monthOf(e.d)===m&&e.kind==="milk"){ milkAgg.qty+=e.qty; milkAgg.kes+=e.qty*e.p; } }
  html+=milkAgg.qty<=0
    ? '<div class="ledger"><div class="empty"><p>No milk was sold in '+esc(monthLabel(m))+'.</p></div></div>'
    : '<p class="sumline" style="margin-top:0">'+fmtL(milkAgg.qty)+' litres sold for <b>'+fmtKES(milkAgg.kes)+'</b>.</p>';

  html+='<h3 class="sec">Shop sales</h3>';
  const agg={};
  for(const e of state.sales){
    if(monthOf(e.d)!==m||e.kind!=="cereal") continue;
    if(!findCereal(e.cerealId)) continue;
    const a=agg[e.cerealId]||(agg[e.cerealId]={name:productName(e),cerealId:e.cerealId,unit:productUnit(e),qty:0,kes:0,cost:0});
    a.qty+=e.qty; a.kes+=e.qty*e.p; a.cost+=saleCost(e);
  }
  const list=Object.keys(agg).map(k=>agg[k]).sort((a,b)=>b.kes-a.kes);
  let shopKes=0, shopCost=0;
  if(!list.length){
    html+='<div class="ledger"><div class="empty"><p>Nothing was sold at the shop in '+esc(monthLabel(m))+'.</p></div></div>';
  } else {
    list.forEach(a=>{ shopKes+=a.kes; shopCost+=a.cost; });
    html+='<div class="scroll"><table><thead><tr><th>Product</th><th>Quantity sold</th><th>Total sales</th>'+(showM?'<th>Buying cost</th><th>Profit</th>':'')+'<th>Left in stock now</th></tr></thead><tbody>'
      +list.map(a=>{
        const left=(findCereal(a.cerealId)||{qty:0}).qty, pr=a.kes-a.cost;
        return '<tr><td>'+esc(a.name)+'</td><td>'+fmtL(a.qty)+' '+a.unit+'</td><td>'+fmtKES(a.kes)+'</td>'
          +(showM?'<td>'+fmtKES(a.cost)+'</td><td class="'+(pr<0?"negtxt":"")+'">'+fmtKES(pr)+'</td>':'')
          +'<td>'+fmtL(Math.max(0,left))+' '+a.unit+'</td></tr>';
      }).join("")
      +'</tbody><tfoot><tr><td>All shop products</td><td></td><td>'+fmtKES(shopKes)+'</td>'+(showM?'<td>'+fmtKES(shopCost)+'</td><td>'+fmtKES(shopKes-shopCost)+'</td>':'')+'<td></td></tr></tfoot></table></div>'
      +'<p class="sub" style="margin-top:8px">Total sales = selling price × quantity sold. Buying cost = buying price × quantity sold.</p>';
  }

  html+='<div class="total" style="position:static;margin-top:28px"><div><div class="eq">Total revenue for '+esc(monthLabel(m))+'</div><div class="big">'+fmtKES(milkAgg.kes+shopKes)+'</div><div class="eq">'+fmtKES(milkAgg.kes)+' from milk, '+fmtKES(shopKes)+' from the shop</div></div></div>';

  if(showM){
    const fc=farmCostsFor(m);
    const shopProfit=round2(shopKes-shopCost), farmProfit=round2(milkAgg.kes-fc.total), grand=round2(shopProfit+farmProfit);
    const rev=milkAgg.kes+shopKes;
    html+='<h3 class="sec">Profit margins</h3><div class="mgrid">'
      +marginCardHTML("Shop margin",shopProfit,shopKes,shopCost,"cost of goods","")
      +marginCardHTML("Farm margin",farmProfit,milkAgg.kes,fc.total,"farm costs","")
      +marginCardHTML("Grand margin",grand,rev,shopCost+fc.total,"total costs","grand")
      +'</div>'
      +'<p class="sub" style="margin-top:10px">Shop margin = shop sales − (buying price × quantity sold). Farm margin = milk sales − all farm costs for the month. Grand margin = shop margin + farm margin.</p>'
      +'<h3 class="sec">Farm costs for '+esc(monthLabel(m))+'</h3><div class="scroll"><table><thead><tr><th>Cost</th><th>Amount</th></tr></thead><tbody>'
      +'<tr><td>Feed (silage, fodder, dairy meal, supplements)</td><td>'+fmtKES(fc.feed)+'</td></tr>'
      +'<tr><td>Casual labour</td><td>'+fmtKES(fc.casual)+'</td></tr>'
      +'<tr><td>Permanent staff</td><td>'+fmtKES(fc.staff)+'</td></tr>'
      +'<tr><td>Land hire</td><td>'+fmtKES(fc.land)+'</td></tr>'
      +'<tr><td>Inputs & other expenditures</td><td>'+fmtKES(fc.other)+'</td></tr>'
      +'</tbody><tfoot><tr><td>Total farm costs</td><td>'+fmtKES(fc.total)+'</td></tr></tfoot></table></div>';
    if(state.lands.length){
      const mc=state.costs.filter(c=>monthOf(c.date)===m);
      const rows=state.lands.map(l=>({name:l.name,hire:landHire(l),exp:mc.filter(c=>c.landId===l.id).reduce((a,c)=>a+c.amount,0)}));
      const un=mc.filter(c=>!c.landId||!findLand(c.landId)).reduce((a,c)=>a+c.amount,0);
      if(un>0) rows.push({name:"Not tied to a land",hire:0,exp:un});
      html+='<h3 class="sec">Costs by land</h3><div class="scroll"><table><thead><tr><th>Land</th><th>Land hire</th><th>Expenditures</th><th>Total</th></tr></thead><tbody>'
        +rows.map(r=>'<tr><td>'+esc(r.name)+'</td><td>'+fmtKES(r.hire)+'</td><td>'+fmtKES(r.exp)+'</td><td><b>'+fmtKES(r.hire+r.exp)+'</b></td></tr>').join("")+'</tbody></table></div>';
    }
  }
  el.innerHTML=html;
}

function timelineHTML(c){
  const stages=breedingTimeline(c); if(!stages) return "";
  const next=stages.find(s=>s.days>=0);
  const rows=stages.map(s=>{
    const done=s.days<0, isNext=next&&s.key===next.key;
    let when="", whenCls="";
    if(done){ when="Done"; }
    else if(s.days===0){ when="Today"; whenCls="today"; }
    else { when="In "+s.days+(s.days===1?" day":" days"); whenCls=s.days<=7?"soon":""; }
    return '<li class="tstep'+(done?" done":"")+(isNext?" next":"")+'"><div class="tdot" aria-hidden="true"></div>'
      +'<div class="tbody"><div class="tlabel">'+esc(s.label)+'<span class="tdate">'+esc(fmtDate(s.date))+'</span></div>'
      +'<div class="tnote">'+esc(s.note)+'</div></div><div class="twhen '+whenCls+'">'+when+'</div></li>';
  }).join("");
  return '<div class="block"><h3>Breeding timeline</h3><p style="margin-bottom:10px">Worked out from the insemination date, assuming the standard '+GESTATION_DAYS+'-day gestation.</p><ul class="timeline">'+rows+'</ul></div>';
}
function detailHTML(c){

    ["Tag number",val(c.tag)],

    ["Weight",c.weight?esc(c.weight)+" kg":none]
  ];
  const today=todayStr(); let l14=0, k14=0; const items=[];
  for(let i=13;i>=0;i--){ const dt=addDays(today,-i), v=litresFor(c.id,dt)||0; l14+=v; k14+=v*priceFor(c.id,dt); items.push({v:v,t:fmtDate(dt,{day:"numeric",month:"short"})+": "+fmtL(v)+" L"}); }

    +(c.notes?'<div class="block"><h3>Other notes</h3><p>'+esc(c.notes)+'</p></div>':"")

async function verifyPassword(pw){
  const r=await sb.auth.signInWithPassword({email:state.user.email,password:pw});
  if(r.error){ if(/Invalid login credentials/i.test(r.error.message||"")) return false; throw r.error; }
  return true;
}
function formBusy(on,label){ const b=document.getElementById("formsave"); if(b){ b.disabled=on; b.textContent=label; } }
async function saveProfile(){
  const g=id=>document.getElementById(id).value.trim();
  const name=g("p-name"), phone=g("p-phone"), job=g("p-job"), area=g("p-area");
  if(name.length<2||name.length>60) return showErr("formerr","Enter a name of 2 to 60 characters.");
  if(phone&&!PHONE_RE.test(phone)) return showErr("formerr","Enter a valid phone number, for example +254 712 345 678.");
  if(job.length>40) return showErr("formerr","Job title is too long.");
  if(area.length>60) return showErr("formerr","Town or area is too long.");
  document.getElementById("formerr").hidden=true; formBusy(true,"Saving…");
  try{
    await run(sb.rpc("update_my_profile",{p_name:name,p_phone:phone,p_job_title:job,p_area:area}));
    await loadProfile();
    toast("Details saved"); openProfile(); scheduleRender();
    if(state.admin&&state.tab==="members") loadMembers();
  }catch(e){ showErr("formerr","Couldn't save your details. "+friendly(e)); formBusy(false,"Save details"); }
}
async function changeEmail(){
  const email=document.getElementById("e-email").value.trim(), pw=document.getElementById("e-pass").value;
  if(!validEmail(email)) return showErr("formerr","Enter a valid email address.");
  if(email.toLowerCase()===String((state.user&&state.user.email)||"").toLowerCase()) return showErr("formerr","That is already your email.");
  if(!pw) return showErr("formerr","Enter your current password.");
  document.getElementById("formerr").hidden=true; formBusy(true,"Checking…");
  try{
    if(!(await verifyPassword(pw))){ showErr("formerr","Your current password is incorrect."); formBusy(false,"Change email"); return; }
    const res=await run(sb.auth.updateUser({email:email}));
    if(res&&res.user&&res.user.new_email){
      state.dlg={mode:"profile",note:"We sent a confirmation link to "+email+". Your email changes after you open it."}; renderDialog();
    } else {
      state.user.email=email; if(state.profile) state.profile.email=email;
      toast("Email updated"); openProfile(); scheduleRender();
    }
  }catch(e){ showErr("formerr","Couldn't change the email. "+friendly(e)); formBusy(false,"Change email"); }
}
async function changePassword(){
  const cur=document.getElementById("w-cur").value, n1=document.getElementById("w-new").value, n2=document.getElementById("w-new2").value;
  if(!cur) return showErr("formerr","Enter your current password.");
  if(n1.length<8) return showErr("formerr","The new password must be at least 8 characters.");
  if(n1!==n2) return showErr("formerr","The two new passwords don't match.");
  if(n1===cur) return showErr("formerr","Choose a password different from the current one.");
  document.getElementById("formerr").hidden=true; formBusy(true,"Checking…");
  try{
    if(!(await verifyPassword(cur))){ showErr("formerr","Your current password is incorrect."); formBusy(false,"Change password"); return; }
    await run(sb.auth.updateUser({password:n1}));
    toast("Password updated"); openProfile();
  }catch(e){ showErr("formerr","Couldn't change the password. "+friendly(e)); formBusy(false,"Change password"); }
}

function readForm(){
  const g=id=>document.getElementById(id).value.trim();
  return {tag:g("f-tag"),name:g("f-name"),breed:g("f-breed"),dob:g("f-dob"),status:g("f-status"),weight:g("f-weight"),
    lastCalving:g("f-last"),insemination:g("f-insem"),bull:g("f-bull"),pregnancy:g("f-preg"),health:g("f-health"),notes:g("f-notes")};
}
function validateCow(f,editing){
  if(!f.tag) return "Enter the cow's tag number.";
  const dup=state.cows.find(c=>c.id!==(editing&&editing.id)&&String(c.tag).toLowerCase()===f.tag.toLowerCase());
  if(dup) return "Tag "+f.tag+" is already used by "+(dup.name||"another cow")+".";
  const t=todayStr();
  if(f.dob&&f.dob>t) return "Date of birth can't be in the future.";
  if(f.lastCalving&&f.lastCalving>t) return "Last calving date can't be in the future.";
  if(f.insemination&&f.insemination>t) return "Insemination date can't be in the future.";
  if(f.dob&&f.lastCalving&&f.lastCalving<f.dob) return "Last calving date is before the date of birth.";
  if(f.dob&&f.insemination&&f.insemination<f.dob) return "Insemination date is before the date of birth.";
  if(f.weight!==""){ const w=parseFloat(f.weight); if(!(w>0&&w<2000)) return "Enter the weight in kilograms, for example 450."; }
  return "";
}
// An update or delete that the database silently refuses returns no rows; treat that as a permission problem
function needRows(rows){ if(!rows||!rows.length){ const e=new Error("permission denied"); e.code="42501"; throw e; } }

async function saveCow(){
  const errEl=document.getElementById("formerr"), btn=document.getElementById("cowsave");
  const editing=state.dlg&&state.dlg.id?findCow(state.dlg.id):null, f=readForm(), err=validateCow(f,editing);
  if(err){ errEl.textContent=err; errEl.hidden=false; return; }
  errEl.hidden=true; btn.disabled=true; btn.textContent="Saving…";
  try{
    const row=cowToRow(f);
    if(editing) needRows(await run(sb.from("cows").update(row).eq("id",editing.id).select("id")));
    else await run(sb.from("cows").insert(row));
    await loadCore();
    toast("Cow saved");
    if(editing) openDetail(editing.id); else closeDlg();
    scheduleRender();
  }catch(e){
    errEl.textContent="Couldn't save the cow. "+friendly(e); errEl.hidden=false; btn.disabled=false; btn.textContent="Save cow";
  }
}
async function deleteCow(){
  const id=state.dlg&&state.dlg.id, btn=document.getElementById("delbtn"), errEl=document.getElementById("delerr");
  if(!id) return;
  btn.disabled=true; btn.textContent="Deleting…"; errEl.hidden=true;
  try{
    needRows(await run(sb.from("cows").delete().eq("id",id).select("id")));
    for(const k of Object.keys(state.milk)) if(k.startsWith(id+"|")) delete state.milk[k];
    await loadCore();
    closeDlg(); toast("Cow deleted"); scheduleRender();
  }catch(e){
    errEl.textContent="Couldn't delete the cow. "+friendly(e); errEl.hidden=false; btn.disabled=false; btn.textContent="Delete cow";
  }
}

async function saveCereal(){
  const btn=document.getElementById("cerealsave");
  const g=id=>document.getElementById(id).value.trim();
  const name=g("c-name"), unit=g("c-unit"), buyingPrice=parseFloat(g("c-buying")), price=parseFloat(g("c-price")), qty=parseFloat(g("c-qty"));
  const editing=state.dlg&&state.dlg.id?findCereal(state.dlg.id):null;
  if(!name) return showErr("formerr","Enter the product name.");
  if(state.cereals.find(c=>c.id!==(editing&&editing.id)&&String(c.name).toLowerCase()===name.toLowerCase())) return showErr("formerr",name+" is already in the list.");
  if(!UNITS.some(u=>u[0]===unit)) return showErr("formerr","Choose what it's sold by.");
  if(!(buyingPrice>=0&&buyingPrice<=MAX_KG)) return showErr("formerr","Enter a buying price of 0 or more.");
  if(!(price>0&&price<=MAX_KG)) return showErr("formerr","Enter a selling price per unit above 0, for example 120.");
  if(!(qty>=0&&qty<=1e7)) return showErr("formerr","Enter the quantity remaining, 0 or more.");
  document.getElementById("formerr").hidden=true; btn.disabled=true; btn.textContent="Saving…";
  const row={name:name,unit:unit,buying_price:round2(buyingPrice),price_per_kg:round2(price),qty_kg:round2(qty)};
  try{
    if(editing) needRows(await run(sb.from("cereals").update(row).eq("id",editing.id).select("id")));
    else await run(sb.from("cereals").insert(row));
    await loadCore();
    closeDlg(); toast("Product saved"); scheduleRender();
  }catch(e){
    showErr("formerr","Couldn't save the product. "+friendly(e)); btn.disabled=false; btn.textContent="Save product";
  }
}
async function deleteCereal(){
  const id=state.dlg&&state.dlg.id, btn=document.getElementById("delbtn"), errEl=document.getElementById("delerr");
  if(!id) return;
  btn.disabled=true; btn.textContent="Deleting…"; errEl.hidden=true;
  try{
    needRows(await run(sb.from("cereals").delete().eq("id",id).select("id")));
    await loadCore(); await Promise.all(Array.from(state.loadedMonths).map(loadMonth));
    closeDlg(); toast("Product deleted"); scheduleRender();
  }catch(e){
    errEl.textContent="Couldn't delete the product. "+friendly(e); errEl.hidden=false; btn.disabled=false; btn.textContent="Delete product";
  }
}

document.addEventListener("click",e=>{
  const sec=e.target.closest("[data-section]");
  if(sec){
    state.section=sec.dataset.section;
    const tabs=tabsFor(state.section); if(tabs) state.tab=tabs[0][0];
    if(state.section==="members") state.members.loaded=false;
    renderAll(); return;
  }
  const tab=e.target.closest("[data-tab]");
  if(tab){ state.tab=tab.dataset.tab; renderAll(); return; }
  const at=e.target.closest("[data-authtab]");
  if(at){ state.authTab=at.dataset.authtab; state.authNote=""; renderAuth(); return; }
  if(state.sale.open && !e.target.closest("#s-product-combo")){
    state.sale.open=false;
    const chosen=selectedProduct(), inp=$("#s-product-search");
    if(inp && chosen) inp.value=chosen.name;
    renderProductMenu();
  }
  const open=e.target.closest("[data-open]");
  if(open){ openDetail(open.dataset.open); return; }
  const a=e.target.closest("[data-act]"); if(!a) return;
  switch(a.dataset.act){
    case "logout": logout(); break;
    case "cancel-pin": cancelPin(); break;
    case "open-profile": openProfile(); break;
    case "edit-profile": openProfileForm("profile-edit","p-name"); break;
    case "change-email": openProfileForm("profile-email","e-email"); break;
    case "change-password": openProfileForm("profile-password","w-cur"); break;
    case "open-member": openMember(a.dataset.id); break;
    case "create-member": state.dlg={mode:"member-create"}; renderDialog(); openDlg(); break;
    case "cancel-member-remove": openMember(state.dlg.id); break;
    case "pin-normal": continueAsNormal(); break;
    case "set-role": setRole(a.dataset.id,a.dataset.role); break;
    case "ask-remove-member": state.dlg={mode:"member-confirm",id:a.dataset.id}; renderDialog(); openDlg(); break;
    case "remove-member": removeMember(); break;
    case "reload-members": state.members.loaded=false; renderMembers(); break;
    case "retry": state.error=""; if(state.ready){ reloadAll(); } else { enterApp(); } break;
    case "goto-herd": state.section="farm"; state.tab="herd"; renderAll(); break;
    case "save-milk": saveMilk(); break;
    case "delete-allocation": deleteMilkAllocation(a.dataset.id); break;
    case "edit-allocation": editMilkAllocation(a); break;
    case "cancel-allocation-edit": resetAllocationForm(); break;
    case "edit-milk-row": {
      const id=a.dataset.id, row=a.closest(".row"), inp=row&&row.querySelector('input[data-cow]');

      } else {
        state.milkEditing[id]=true; inp.disabled=false; a.dataset.editing="1"; a.textContent="Save log"; inp.focus(); inp.select();
      }
      break;
    }
    case "add": openForm(null); break;
    case "edit": openForm(state.dlg.id); break;
    case "close": closeDlg(); break;
    case "cancel-form": if(state.dlg.id) openDetail(state.dlg.id); else closeDlg(); break;
    case "ask-delete": state.dlg={mode:"confirm",id:state.dlg.id}; renderDialog(); break;
    case "cancel-delete": openDetail(state.dlg.id); break;
    case "delete": deleteCow(); break;
    case "add-cereal": openCerealForm(null); break;
    case "edit-cereal": openCerealForm(a.dataset.id); break;

    case "cancel-delete-cereal": openCerealForm(state.dlg.id); break;

    case "view-receipt": viewReceipt(a.dataset.path,a.dataset.sale); break;
    case "receipt-clear": setReceiptFile(null); break;
    case "acc-toggle": {
      const key=a.dataset.key, item=a.closest(".acc-item"), isOpen=!state.farmOpen[key];
      state.farmOpen[key]=isOpen;
      if(item) item.classList.toggle("open",isOpen);

      const inp=$("#s-product-search");

    case "staff-ask-delete": state.dlg={mode:"staff-confirm",id:a.dataset.id}; renderDialog(); openDlg(); break;
    case "staff-delete": deleteStaff(); break;
    case "cost-add": openCostForm(null,a.dataset.land); break;
    case "cost-land-filter": state.costLand=a.dataset.id; renderFarm(); break;
    case "land-add": state.dlg={mode:"land-form",id:null}; renderDialog(); openDlg(); { const f=document.getElementById("ld-name"); if(f) f.focus(); } break;
    case "land-ask-delete": state.dlg={mode:"land-confirm",id:a.dataset.id}; renderDialog(); openDlg(); break;

    case "cost-edit": openCostForm(a.dataset.id); break;

    case "cost-delete": deleteCost(); break;

      break;
    case "save-casual": saveCasual(); break;
    case "casual-edit": state.dlg={mode:"casual-form",id:a.dataset.id}; renderDialog(); openDlg(); { const f=document.getElementById("ce-name"); if(f) f.focus(); } break;

    case "prev-month": state.month=shiftMonth(state.month,-1); renderSummary(); break;
    case "next-month": state.month=shiftMonth(state.month,1); renderSummary(); break;
  }
});
document.addEventListener("input",e=>{
  const t=e.target; if(!t.closest) return;
  const inp=t.closest("#logbody input[data-cow]");
  if(inp){
    state.draft[state.date+"|"+inp.dataset.cow]=inp.value;
    const n=parseFloat(inp.value), k=document.querySelector('[data-kes="'+CSS.escape(inp.dataset.cow)+'"]');
    if(k) k.textContent=isFinite(n)&&n>0?fmtKES(n*priceFor(inp.dataset.cow,state.date)):"";
    const er=$("#logerr"); if(er) er.hidden=true;
    updateTotals(); return;
  }
  if(t.id==="a-qty"){ updateAddTotal(); return; }
  if(t.closest("#saleform")){
    if(t.id==="s-product-search"){
      state.sale.query=t.value;
      state.sale.open=true;
      state.sale.hi=0;
      const list=filteredSaleProducts();
      if(list.length && !list.some(p=>p.value===state.sale.product)){
        state.sale.product=list[0].value;
      } else if(!list.length){
        state.sale.product="";
      }
      const er=$("#saleerr"); if(er) er.hidden=true;
      renderProductMenu();
      updateSaleInfo();
      return;
    }
    if(t.id==="s-qty") state.sale.qty=t.value;
    else if(t.id==="s-time") state.sale.time=t.value;
    const er=$("#saleerr"); if(er) er.hidden=true;
    updateSaleInfo(); return;
  }
  const fi=t.closest("input[data-field]");
  if(fi){
    state.feedDraft[state.careDate+"|"+fi.dataset.cow+"|"+fi.dataset.field]=fi.value;
    const er=$("#feederr"); if(er) er.hidden=true;
    updateFeedButton();
    updateFeedTotals();
    return;
  }
  if(t.id==="casual-count"||t.id==="casual-wage"){
    state.casualDraft[state.casualDate+":"+(t.id==="casual-count"?"count":"wage")]=t.value;
    const n=(parseFloat(casualDraftVal("count"))||0)*(parseFloat(casualDraftVal("wage"))||0), tot=$("#casualtotal");
    if(tot) tot.textContent = n>0 ? "Total for the day: "+fmtKES(n) : "";
    const er=$("#casualerr"); if(er) er.hidden=true; return;
  }
  if(t.id==="shop-search"){
    state.shopQuery=t.value;
    const bar=$("#shop-searchbar");
    if(bar) bar.classList.toggle("has-query", !!t.value.trim());
    renderShopList();
    return;
  }
  if(t.id==="herd-search"){
    state.herdQuery=t.value;
    const bar=$("#herd-searchbar");
    if(bar) bar.classList.toggle("has-query", !!t.value.trim());
    renderHerdList();
    return;
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="s-receipt"||t.id==="s-receipt-cam"){
    const f=t.files&&t.files[0];
    if(f){ if(/^image\//.test(f.type)||/\.(heic|heif)$/i.test(f.name)) setReceiptFile(f); else toast("Choose a photo of the receipt.",true); }
    t.value=""; return;
  }
  if(t.id==="assignrole"){ assignRole(t.dataset.user,t.value||null); return; }

  if(t.id==="dailydate"){
    if(!t.value){ t.value=state.salesDate; return; }
    state.salesDate=t.value>todayStr()?todayStr():t.value; t.value=state.salesDate;
    resetAllocationForm(); ensureMonth(monthOf(state.salesDate)); refreshSaleForm(); renderDailyBody(); loadMilkAllocations(); loadMilkBalanceSummary(); return;
  }
  if(t.id==="costperiod"||t.id==="costdate"){
    if(t.id==="costperiod") state.costPeriod=t.value;
    else state.costDate=t.value||todayStr();
    loadCostReport();
    return;
  }
  if(t.id==="feeddate"){
    if(!t.value){ t.value=state.careDate; return; }
    state.careDate=t.value>todayStr()?todayStr():t.value; t.value=state.careDate;
    state.feedEditing={};
    ensureMonth(monthOf(state.careDate)); renderFeedBody(); return;
  }
  if(t.id==="casualdate"){
    if(!t.value){ t.value=state.casualDate; return; }
    state.casualDate=t.value>todayStr()?todayStr():t.value; t.value=state.casualDate;
    ensureMonth(monthOf(state.casualDate)); renderFarm(); return;
  }
  if(t.id!=="logdate") return;
  const v=t.value;
  if(!v){ t.value=state.date; return; }
  state.date = v>todayStr()?todayStr():v; t.value=state.date;
  state.milkEditing={};
  ensureMonth(monthOf(state.date));
  renderLogBody();
});
document.addEventListener("focusin",e=>{
  if(e.target&&e.target.id==="s-product-search"){
    state.sale.open=true;
    state.sale.query="";
    e.target.select();
    renderProductMenu();
  }
});
document.addEventListener("keydown",e=>{
  if(e.target&&e.target.id==="s-product-search"){
    const list=filteredSaleProducts();
    if(e.key==="ArrowDown"){
      e.preventDefault();
      state.sale.open=true;
      if(list.length) state.sale.hi=(state.sale.hi+1)%list.length;
      renderProductMenu();
      return;
    }
    if(e.key==="ArrowUp"){
      e.preventDefault();
      state.sale.open=true;
      if(list.length) state.sale.hi=(state.sale.hi-1+list.length)%list.length;
      renderProductMenu();
      return;
    }
    if(e.key==="Enter"&&state.sale.open){
      e.preventDefault();
      const pick=list[state.sale.hi]||list[0];
      if(pick){
        state.sale.product=pick.value;
        state.sale.open=false;
        state.sale.query="";
        e.target.value=pick.name;
        renderProductMenu();
        updateSaleInfo();
        const qInp=$("#s-qty"); if(qInp) qInp.focus();
      }
      return;
    }
    if(e.key==="Escape"&&state.sale.open){
      e.preventDefault();
      state.sale.open=false;
      const chosen=selectedProduct();
      if(chosen) e.target.value=chosen.name;
      renderProductMenu();
      return;
    }
  }
  if(e.key==="Enter"&&e.target.matches&&e.target.matches("#logbody input[data-cow]")){
    e.preventDefault();
    const all=Array.from(document.querySelectorAll("#logbody input[data-cow]")).filter(x=>!x.disabled), i=all.indexOf(e.target);
    if(i>=0&&i<all.length-1) all[i+1].focus(); else e.target.blur();
  }
});
document.addEventListener("submit",e=>{
  const id=e.target.id;
  if(id==="cowform"){ e.preventDefault(); saveCow(); }
  else if(id==="cerealform"){ e.preventDefault(); saveCereal(); }
  else if(id==="saleform"){ e.preventDefault(); recordSaleFromForm(); }
  else if(id==="addstockform"){ e.preventDefault(); saveAddStock(); }
  else if(id==="milkeditform"){ e.preventDefault(); saveMilkEdit(); }
  else if(id==="roleform"){ e.preventDefault(); saveRole(); }
  else if(id==="staffform"){ e.preventDefault(); saveStaff(); }
  else if(id==="costform"){ e.preventDefault(); saveCost(); }
  else if(id==="casualeditform"){ e.preventDefault(); saveCasualEdit(); }
  else if(id==="landform"){ e.preventDefault(); saveLand(); }
  else if(id==="identityform"){ e.preventDefault(); saveFarmIdentity(); }
  else if(id==="profileform"){ e.preventDefault(); saveProfile(); }
  else if(id==="membercreateform"){ e.preventDefault(); createMember(); }
  else if(id==="emailform"){ e.preventDefault(); changeEmail(); }
  else if(id==="passwordform"){ e.preventDefault(); changePassword(); }
  else if(id==="loginform"){ e.preventDefault(); doLogin(); }
  else if(id==="forgotform"){ e.preventDefault(); doForgot(); }
  else if(id==="signupform"){ e.preventDefault(); doSignUp(); }
  else if(id==="recoveryform"){ e.preventDefault(); doRecovery(); }
});
document.addEventListener("dragover",e=>{ const z=e.target.closest&&e.target.closest("#receipt-dz"); if(z){ e.preventDefault(); z.classList.add("drag"); } });
document.addEventListener("dragleave",e=>{ const z=e.target.closest&&e.target.closest("#receipt-dz"); if(z&&!z.contains(e.relatedTarget)) z.classList.remove("drag"); });
document.addEventListener("drop",e=>{
  const z=e.target.closest&&e.target.closest("#receipt-dz"); if(!z) return;
  e.preventDefault(); z.classList.remove("drag");
  const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
  if(f&&/^image\//.test(f.type)) setReceiptFile(f); else if(f) toast("Choose a photo of the receipt.",true);
});
$("#dlg").addEventListener("click",e=>{ if(e.target===$("#dlg")) closeDlg(); });
$("#dlg").addEventListener("close",()=>{ state.dlg=null; });

/* ---------- Start ---------- */
async function init(){
  if(!configured){ state.auth="config"; renderAll(); return; }
  if(typeof window.supabase==="undefined"||!window.supabase.createClient){
    state.auth="out"; state.error="Couldn't load the Supabase library. Check your internet connection and reload."; renderAll(); return;
  }
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  renderAll();
  // Do not call other Supabase methods directly inside this callback
  sb.auth.onAuthStateChange((event)=>{
    if(event==="PASSWORD_RECOVERY"){ state.recovery=true; setTimeout(()=>{ state.auth="recovery"; renderAll(); },0); }
    else if(event==="SIGNED_OUT"){ setTimeout(()=>{ if(state.auth==="in"||state.auth==="pin") resetToLogin(); },0); }
  });
  let session=null;
  try{ const r=await sb.auth.getSession(); session=r.data&&r.data.session; }catch(e){}
  if(state.recovery){ state.auth="recovery"; renderAll(); return; }
  if(session){ await enterApp(); return; }
  state.auth="out"; state.authTab="login";
  renderAll();
}
init();
})();
</script>
